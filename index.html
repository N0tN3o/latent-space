<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Space, Through the Eyes of the Algorithm</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        @font-face {
            font-family: 'Korolev Medium';
            src: url('/korolev-medium.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Korolev Medium', 'Arial', sans-serif;
            background-color: #ffffff;
            color: #2a2a2a;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        .floating-nav {
            position: fixed;
            top: 14px;
            right: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            z-index: 100;
            opacity: 0.25;
            transition: opacity 0.25s ease;
        }
        .floating-nav:hover {
            opacity: 1;
        }
        .floating-nav a, .floating-nav button {
            background: #1f1f1f;
            color: #fff;
            text-decoration: none;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.76rem;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .floating-nav a:hover, .floating-nav button:hover {
            background: #3a3a3a;
        }
        .floating-nav .live-active {
            background: #10b981;
            color: #fff;
        }

        .scribble-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
            min-height: 220px;
        }

        .scribble-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scribble-container img {
            width: 92%;
            max-height: 450px;
            object-fit: contain;
            display: block;
        }

        .scribble-placeholder {
            color: #888;
            font-size: 0.92em;
            letter-spacing: 0.5px;
            padding: 48px 20px;
            border: 1px dashed #ddd;
            border-radius: 10px;
            text-align: center;
            width: 100%;
        }

        .archetype-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 14px;
            font-size: 0.74em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #444;
            border: 1px solid #d0d0d0;
            border-radius: 20px;
            background: #fafafa;
        }

        .bottom-grid {
            width: 100%;
            border-collapse: separate;
            border-spacing: 10px;
            margin-top: 6px;
            margin-bottom: 0px;
        }

        .grid-item {
            background: rgba(255, 255, 255, 0);
            padding: 20px;
            box-shadow: none;
            vertical-align: top;
        }

        .section-title {
            font-size: 0.8em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            font-weight: 600;
            color: #666;
        }

        .psychoanalysis-text {
            text-align: justify;
            font-size: 0.85em;
            line-height: 1.48;
            white-space: pre-line;
        }

        .visual-metrics-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-top: 26px;
        }

        .heatmap-container img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border: 1px solid #eee;
        }

        .qr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 8px 12px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            background: #fcfcfc;
        }

        .qr-card svg, .qr-card img {
            width: 96px;
            height: 96px;
            display: block;
        }

        .qr-caption {
            font-size: 0.68em;
            color: #666;
            margin-top: 4px;
            line-height: 1.25;
            max-width: 115px;
        }

        .poem-text {
            font-style: italic;
            white-space: pre-line;
            line-height: 1.55;
            font-size: 0.85em;
            text-align: left;
        }

        .update-info {
            text-align: center;
            color: #333;
            font-size: 0.82em;
            margin-top: 0px;
            font-style: italic;
        }

        .page-footer {
            margin-top: 20px;
            padding: 16px 20px;
            text-align: center;
            border-top: 1px solid #ddd;
        }

        .attribution-section {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #ccc;
            font-size: 0.78em;
            color: #444;
            line-height: 1.5;
        }

        .attribution-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            max-width: 1050px;
            margin: 0 auto;
        }

        .attribution-logo {
            display: none;
            max-width: 115px;
            height: auto;
            opacity: 0.9;
        }

        .attribution-text {
            text-align: center;
        }

        .attribution-text a {
            color: #111;
            font-weight: 600;
            text-decoration: underline;
            margin: 0 3px;
        }

        .attribution-text a:hover {
            color: #0d6efd;
        }

        @media (max-width: 1024px) {
            .bottom-grid, .bottom-grid tbody, .bottom-grid tr, .bottom-grid td {
                display: block;
                width: 100% !important;
            }
        }

        .error-banner {
            max-width: 780px;
            margin: 0 auto 18px;
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid #dc2626;
            background: #fef2f2;
            color: #991b1b;
            text-align: center;
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .error-banner .error-code-pill {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 10px;
            border-radius: 6px;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            font-family: Consolas, monospace;
            font-size: 0.82rem;
            font-weight: 700;
        }

        @page {
            size: A4;
            margin: 12mm;
        }

        @media print {
            audio, .floating-nav { display: none !important; }
            .container { padding: 0 10px 8px; }
            .update-info { display: block; }
            .page-footer {
                position: static;
                margin-top: 14px;
                padding: 10px 16px;
                background: white;
                border-top: 1px solid #ddd;
                page-break-inside: avoid;
            }
            .attribution-text a {
                text-decoration: none;
                color: #222;
            }
        }
    </style>
</head>
<body>
    <nav class="floating-nav">
        <button onclick="stepHistory(1)" title="Older Artwork (Left Arrow)">Prev</button>
        <button id="liveModeBtn" class="live-active" onclick="returnToLive()" title="Return to Live Feed">Live</button>
        <button onclick="stepHistory(-1)" title="Newer Artwork (Right Arrow)">Next</button>
        <a href="/draw">Gaze Draw</a>
        <a href="/kiosk">Print Kiosk</a>
        <button onclick="window.print()">Print</button>
    </nav>

    <div class="container">
        <div id="errorBanner" class="error-banner" style="display: none;"></div>
        <div class="scribble-section">
            <div class="scribble-container">
                <img id="mainScribble" alt="Gaze drawing" style="display: none;">
                <div id="scribblePlaceholder" class="scribble-placeholder">
                    Waiting for the first gaze drawing — open <a href="/draw" style="color: #2a2a2a;">Gaze Draw</a> to begin.
                </div>
            </div>
        </div>

        <header style="text-align: center; margin-bottom: 4px;">
            <h1 style="font-size: 1.5em; font-weight: 400; letter-spacing: 2px; color: #2a2a2a;">
                Latent Space, Through the Eyes of the Algorithm
            </h1>
            <div id="archetypeContainer" style="display: none;">
                <span class="archetype-badge" id="archetypeBadge"></span>
            </div>
        </header>

        <table class="bottom-grid">
            <tr>
                <td class="grid-item" style="width: 55%;">
                    <h2 class="section-title">Analysis</h2>
                    <div class="psychoanalysis-text" id="psychoanalysisText"></div>
                </td>

                <td class="grid-item" style="width: 45%;">
                    <h2 class="section-title">Poem</h2>
                    <div class="poem-text" id="poemText"></div>
                    <audio id="poemAudio" controls style="width: 100%; margin-top: 18px; display: none;">
                        <source src="" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>

                    <div class="visual-metrics-row">
                        <div id="heatmapSection" style="display: none;">
                            <h2 class="section-title" style="margin-bottom: 10px;">Attention Span</h2>
                            <div class="heatmap-container">
                                <img id="heatmapImage" alt="Heatmap visualization">
                            </div>
                        </div>
                        <div class="qr-card" id="qrCard" style="display: none;">
                            <div id="qrCodeBox"></div>
                            <div class="qr-caption" id="qrCaption">Scan to save your digital print</div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>

        <footer class="page-footer">
            <div class="update-info">
                <p><span id="lastUpdate">Waiting for data...</span></p>
            </div>

            <div class="attribution-section" id="attributionSection" style="display: none;">
                <div class="attribution-inner">
                    <img id="attributionLogo" class="attribution-logo" alt="Kasboek Logo" style="display: none;">
                    <div class="attribution-text" id="attributionText"></div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const CONFIG = {
            dataFile: '/shared_output/content.json',
            attributionsApi: '/api/settings/attributions',
            statusApi: '/api/public/info',
            printsApi: '/api/files/prints',
            refreshInterval: 4000,
        };

        const isPrintRender = new URLSearchParams(window.location.search).get('print_render') === '1';
        let lastContentSignature = null;
        let lastAttrSignature = null;
        let lanBaseUrl = window.location.origin;
        let lanUrlFetched = false;
        let liveRunId = null;

        let historyList = [];
        let historyIdx = -1;

        function buildPath(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('/')) {
                return path;
            }
            if (path.startsWith('shared_output/')) {
                return '/' + path;
            }
            return '/shared_output/' + path;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function safeUrl(url) {
            const u = String(url ?? '').trim();
            if (/^(https?:\/\/|\/(?!\/))/i.test(u)) return escapeHtml(u);
            return '';
        }

        function parseSafeDate(ts) {
            if (!ts) return null;
            const s = String(ts).trim().replace(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})/, '$1T$2');
            const d = new Date(s);
            return isNaN(d.getTime()) ? null : d;
        }

        function renderQRCode(targetPath, isPdfRendering = false) {
            const qrCard = document.getElementById('qrCard');
            const qrBox = document.getElementById('qrCodeBox');
            const qrCaption = document.getElementById('qrCaption');
            if (!targetPath) {
                qrCard.style.display = 'none';
                qrBox.innerHTML = '';
                return;
            }
            if (isPdfRendering && !isPrintRender) {
                qrBox.innerHTML = '<div style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:0.72em;color:#777;">Preparing PDF...</div>';
                qrCaption.textContent = 'Generating digital print';
                qrCard.style.display = 'flex';
                return;
            }
            qrCaption.textContent = 'Scan to save your digital print';
            const fullUrl = targetPath.startsWith('http')
                ? targetPath
                : `${lanBaseUrl}${buildPath(targetPath)}`;
            if (typeof qrcode !== 'undefined') {
                try {
                    const qr = qrcode(0, 'M');
                    qr.addData(fullUrl);
                    qr.make();
                    qrBox.innerHTML = qr.createSvgTag({ cellSize: 3, margin: 1 });
                    qrCard.style.display = 'flex';
                    return;
                } catch (_) {}
            }
            // Offline fallback: server-generated SVG QR code
            qrBox.innerHTML = `<img src="/api/qr.svg?url=${encodeURIComponent(fullUrl)}" alt="Digital print QR code">`;
            qrCard.style.display = 'flex';
        }

        function renderBadge(archetype, fractalDim, spatialEntropy) {
            const container = document.getElementById('archetypeContainer');
            const badge = document.getElementById('archetypeBadge');
            if (!archetype && typeof fractalDim !== 'number') {
                container.style.display = 'none';
                return;
            }
            let parts = [];
            if (archetype) parts.push(archetype);
            if (typeof fractalDim === 'number') parts.push(`Fractal D=${fractalDim.toFixed(2)}`);
            if (typeof spatialEntropy === 'number') parts.push(`Entropy=${Math.round(spatialEntropy * 100)}%`);
            badge.textContent = parts.join('  ·  ');
            container.style.display = 'block';
        }

        function renderAttribution(attr) {
            const section = document.getElementById('attributionSection');
            const logo = document.getElementById('attributionLogo');
            const textEl = document.getElementById('attributionText');

            if (!attr || !attr.enabled) {
                section.style.display = 'none';
                logo.style.display = 'none';
                logo.removeAttribute('src');
                textEl.innerHTML = '';
                return;
            }

            section.style.display = 'block';
            if (attr.show_logo !== false) {
                const rawLogo = String(attr.logo_path || '/kasboek-logo.jpg').trim();
                const safeLogo = /^(https?:\/\/|\/(?!\/))/i.test(rawLogo) ? rawLogo : '/kasboek-logo.jpg';
                logo.src = safeLogo + '?t=' + Date.now();
                logo.style.display = 'block';
            } else {
                logo.style.display = 'none';
                logo.removeAttribute('src');
            }

            const intro = escapeHtml(attr.intro_text || 'Made possible by Kasboek.');
            const learnMore = escapeHtml(attr.learn_more_text || 'To learn more, visit');
            const webLabel = escapeHtml(attr.website_label || 'Kasboek Website');
            const webUrl = safeUrl(attr.website_url || '');
            const liLabel = escapeHtml(attr.company_linkedin_label || 'Kasboek LinkedIn');
            const liUrl = safeUrl(attr.company_linkedin_url || '');
            const thanksText = escapeHtml(attr.thanks_text || 'Thank you for letting us use this:');

            let linksHtml = [];
            if (webUrl) {
                linksHtml.push(`<a href="${webUrl}" target="_blank" rel="noopener noreferrer">${webLabel}</a>`);
            }
            if (liUrl) {
                linksHtml.push(`<a href="${liUrl}" target="_blank" rel="noopener noreferrer">${liLabel}</a>`);
            }

            let foundersHtml = [];
            if (Array.isArray(attr.founders)) {
                for (const f of attr.founders) {
                    if (f && f.name && f.name.trim()) {
                        const fName = escapeHtml(f.name.trim());
                        const fUrl = f.url ? safeUrl(f.url) : '';
                        if (fUrl) {
                            foundersHtml.push(`<a href="${fUrl}" target="_blank" rel="noopener noreferrer">${fName}</a>`);
                        } else {
                            foundersHtml.push(`<span>${fName}</span>`);
                        }
                    }
                }
            }

            let html = `<div><strong>${intro}</strong>`;
            if (linksHtml.length > 0) {
                html += ` ${learnMore} ${linksHtml.join(' &middot; ')}.`;
            }
            html += `</div>`;

            if (foundersHtml.length > 0) {
                html += `<div style="margin-top: 3px;">${thanksText} ${foundersHtml.join(' &middot; ')}</div>`;
            }

            if (attr.custom_footer_note && attr.custom_footer_note.trim()) {
                html += `<div style="margin-top: 3px; font-style: italic;">${escapeHtml(attr.custom_footer_note.trim())}</div>`;
            }

            textEl.innerHTML = html;
        }

        async function refreshAttributions() {
            try {
                const attrRes = await fetch(CONFIG.attributionsApi + '?t=' + Date.now());
                if (attrRes.ok) {
                    const attrData = await attrRes.json();
                    const attrSig = JSON.stringify(attrData);
                    if (attrSig !== lastAttrSignature) {
                        lastAttrSignature = attrSig;
                        renderAttribution(attrData);
                    }
                }
            } catch (_) {}
        }

        function clearArtworkView(placeholderText) {
            const scribbleEl = document.getElementById('mainScribble');
            const placeholderEl = document.getElementById('scribblePlaceholder');
            scribbleEl.style.display = 'none';
            scribbleEl.removeAttribute('src');
            placeholderEl.textContent = placeholderText || '';
            placeholderEl.style.display = placeholderText ? 'block' : 'none';

            const hmSection = document.getElementById('heatmapSection');
            const hmImg = document.getElementById('heatmapImage');
            hmImg.removeAttribute('src');
            hmSection.style.display = 'none';

            document.getElementById('archetypeContainer').style.display = 'none';
            document.getElementById('psychoanalysisText').textContent = '';
            document.getElementById('poemText').textContent = '';

            const poemAudio = document.getElementById('poemAudio');
            poemAudio.pause();
            poemAudio.removeAttribute('src');
            poemAudio.style.display = 'none';

            renderQRCode('');
        }

        function applyViewData(data, isHistorical = false) {
            const errorBanner = document.getElementById('errorBanner');
            if (!isHistorical && data.status === 'error') {
                const code = escapeHtml(data.errorCode || 'ERR_PIPELINE_FAILED');
                const msg = escapeHtml(
                    data.userMessage || 'We could not complete your reading. Please try drawing again.'
                );
                errorBanner.innerHTML =
                    `<div><strong>Reading Failed</strong> — ${msg}</div>` +
                    `<div class="error-code-pill">${code}</div>`;
                errorBanner.style.display = 'block';
                clearArtworkView('');
                const errDate = parseSafeDate(data.timestamp);
                document.getElementById('lastUpdate').textContent = errDate
                    ? errDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                    : 'Reading failed';
                return;
            }

            errorBanner.style.display = 'none';
            errorBanner.innerHTML = '';

            const scribbleEl = document.getElementById('mainScribble');
            const placeholderEl = document.getElementById('scribblePlaceholder');
            if (data.scribblePath) {
                scribbleEl.src = buildPath(data.scribblePath) + '?t=' + encodeURIComponent(data.timestamp || Date.now());
                scribbleEl.style.display = 'block';
                placeholderEl.style.display = 'none';
            } else {
                scribbleEl.style.display = 'none';
                scribbleEl.removeAttribute('src');
                placeholderEl.textContent = isHistorical ? 'No preview image archived for this print.' : 'Waiting for drawing...';
                placeholderEl.style.display = 'block';
            }

            const hmSection = document.getElementById('heatmapSection');
            const hmImg = document.getElementById('heatmapImage');
            if (data.heatmapPath) {
                hmImg.src = buildPath(data.heatmapPath) + '?t=' + encodeURIComponent(data.timestamp || Date.now());
                hmSection.style.display = 'block';
            } else {
                hmImg.removeAttribute('src');
                hmSection.style.display = 'none';
            }

            renderBadge(data.archetype, data.fractalDimension, data.spatialEntropy);

            document.getElementById('psychoanalysisText').textContent = data.psychoanalysis || '';
            document.getElementById('poemText').textContent = data.poem || '';

            const poemAudio = document.getElementById('poemAudio');
            if (data.poemAudio && !isHistorical) {
                poemAudio.style.display = 'block';
                poemAudio.src = buildPath(data.poemAudio) + '?t=' + Date.now();
                poemAudio.load();
                poemAudio.play().catch(() => {});
            } else {
                poemAudio.pause();
                poemAudio.removeAttribute('src');
                poemAudio.style.display = 'none';
            }

            renderQRCode(data.printPDF || '', !!data.pdfRendering);

            if (data.timestamp) {
                const updateDate = parseSafeDate(data.timestamp);
                const formatted = updateDate ? updateDate.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : String(data.timestamp);
                document.getElementById('lastUpdate').textContent = isHistorical
                    ? `Archive View (${historyIdx + 1}/${historyList.length}) — ${formatted}`
                    : formatted;
            }
        }

        async function stepHistory(delta) {
            const wasLive = (historyIdx === -1);
            try {
                const res = await fetch(CONFIG.printsApi + '?t=' + Date.now());
                if (res.ok) {
                    const prints = await res.json();
                    historyList = prints.filter(p => p.poem || p.psychoanalysis || p.thumb_url);
                }
            } catch (_) {}

            if (!historyList.length) return;
            let nextIdx = historyIdx + delta;
            if (wasLive && delta > 0 && liveRunId && historyList[0] && historyList[0].run_id === liveRunId && historyList.length > 1) {
                nextIdx = 1;
            }
            if (nextIdx < 0) {
                returnToLive();
                return;
            }
            historyIdx = Math.min(historyList.length - 1, nextIdx);
            document.getElementById('liveModeBtn').classList.remove('live-active');

            const item = historyList[historyIdx];
            const itemTs = item.timestamp ? new Date(item.timestamp * 1000).toISOString() : item.date;
            applyViewData({
                scribblePath: item.thumb_url,
                heatmapPath: item.heatmap_url || '',
                archetype: item.archetype,
                fractalDimension: item.fractalDimension,
                spatialEntropy: item.spatialEntropy,
                psychoanalysis: item.psychoanalysis || 'Archived gaze drawing memento.',
                poem: item.poem || '',
                printPDF: item.pdf_url,
                pdfRendering: false,
                timestamp: itemTs,
            }, true);
        }

        function returnToLive() {
            historyIdx = -1;
            lastContentSignature = null;
            document.getElementById('liveModeBtn').classList.add('live-active');
            loadContent();
        }

        async function loadContent() {
            await refreshAttributions();
            if (historyIdx !== -1) return;
            try {
                if (!lanUrlFetched && (lanBaseUrl.includes('localhost') || lanBaseUrl.includes('127.0.0.1'))) {
                    lanUrlFetched = true;
                    try {
                        const st = await fetch(CONFIG.statusApi);
                        if (st.ok) {
                            const stJson = await st.json();
                            if (stJson.lan_url) lanBaseUrl = stJson.lan_url;
                        }
                    } catch (_) {}
                }

                const response = await fetch(CONFIG.dataFile + '?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    liveRunId = data.runId || null;
                    const sig = JSON.stringify({
                        st: data.status,
                        ec: data.errorCode,
                        s: data.scribblePath,
                        h: data.heatmapPath,
                        p: data.psychoanalysis,
                        m: data.poem,
                        pa: data.poemAudio,
                        pdf: data.printPDF,
                        pr: !!data.pdfRendering,
                        t: data.timestamp
                    });

                    if (sig !== lastContentSignature) {
                        lastContentSignature = sig;
                        applyViewData(data, false);
                    }
                }
            } catch (error) {
                console.log('Waiting for content update:', error.message);
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'p' || event.key === 'P') {
                event.preventDefault();
                window.print();
            } else if (event.key === 'ArrowLeft') {
                stepHistory(1);
            } else if (event.key === 'ArrowRight') {
                stepHistory(-1);
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadContent();
            setInterval(loadContent, CONFIG.refreshInterval);
        });
    </script>
