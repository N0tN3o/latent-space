<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Space, Through the Eyes of the Algorithm</title>
    <style>
        @font-face {
            font-family: 'Korolev Medium';
            src: url('/korolev-medium.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Korolev Medium', 'Arial', sans-serif;
            background-color: #ffffff;
            color: #2a2a2a;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        .floating-nav {
            position: fixed;
            top: 14px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .floating-nav a, .floating-nav button {
            background: #1f1f1f;
            color: #fff;
            text-decoration: none;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.76rem;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
        }
        .floating-nav a:hover, .floating-nav button:hover {
            background: #3a3a3a;
        }
        .floating-nav .live-active {
            background: #10b981;
            color: #fff;
        }
        .gallery-menu-btn {
            opacity: 0.18;
            min-width: 28px;
            padding: 5px 8px !important;
            transition: opacity 0.2s ease, background 0.2s ease;
        }
        .gallery-menu-btn:hover, .gallery-menu-btn.is-open {
            opacity: 0.92;
        }
        .gallery-menu-popover {
            display: none;
            position: fixed;
            top: 50px;
            right: 18px;
            background: #181a20;
            border: 1px solid #333845;
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
            z-index: 105;
            flex-direction: column;
            gap: 6px;
            min-width: 170px;
        }
        .gallery-menu-popover.is-open {
            display: flex;
        }
        .gallery-menu-row {
            display: flex;
            gap: 5px;
        }
        .gallery-menu-row button {
            flex: 1;
        }
        .gallery-menu-popover a, .gallery-menu-popover button {
            background: #252832;
            color: #f3f4f6;
            text-decoration: none;
            border: 1px solid #343947;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        .gallery-menu-popover a:hover, .gallery-menu-popover button:hover {
            background: #343a49;
        }
        .gallery-menu-popover .live-active {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
        }
        .gallery-single-draw-btn {
            background: #10b981 !important;
            color: #ffffff !important;
            font-weight: 600;
            min-width: 106px;
        }
        .gallery-single-draw-btn:hover {
            background: #059669 !important;
        }
        #galleryLangSwitch {
            flex: 0 0 auto;
        }

        .scribble-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
            min-height: 220px;
        }

        .scribble-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scribble-container img {
            width: 92%;
            max-height: 450px;
            object-fit: contain;
            display: block;
        }

        .scribble-placeholder {
            color: #888;
            font-size: 0.92em;
            letter-spacing: 0.5px;
            padding: 48px 20px;
            border: 1px dashed #ddd;
            border-radius: 10px;
            text-align: center;
            width: 100%;
        }

        .archetype-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 14px;
            font-size: 0.74em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #444;
            border: 1px solid #d0d0d0;
            border-radius: 20px;
            background: #fafafa;
        }

        .bottom-grid {
            width: 100%;
            border-collapse: separate;
            border-spacing: 10px;
            margin-top: 6px;
            margin-bottom: 0px;
        }

        .grid-item {
            background: rgba(255, 255, 255, 0);
            padding: 20px;
            box-shadow: none;
            vertical-align: top;
        }

        .section-title {
            font-size: 0.8em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            font-weight: 600;
            color: #666;
        }

        .psychoanalysis-text {
            text-align: justify;
            font-size: 0.85em;
            line-height: 1.48;
            white-space: pre-line;
        }

        .visual-metrics-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-top: 26px;
        }

        .heatmap-container img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border: 1px solid #eee;
        }

        .qr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 8px 12px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            background: #fcfcfc;
        }

        .qr-card svg, .qr-card img {
            width: 96px;
            height: 96px;
            display: block;
        }

        .qr-caption {
            font-size: 0.68em;
            color: #666;
            margin-top: 4px;
            line-height: 1.25;
            max-width: 115px;
        }

        .poem-text {
            font-style: italic;
            white-space: pre-line;
            line-height: 1.55;
            font-size: 0.85em;
            text-align: left;
        }

        .translation-fallback-note {
            display: none;
            margin-top: 8px;
            font-size: 0.72em;
            color: #888;
            font-style: italic;
        }

        @media print {
            .translation-fallback-note { display: none !important; }
        }

        .update-info {
            text-align: center;
            color: #333;
            font-size: 0.82em;
            margin-top: 0px;
            font-style: italic;
        }

        .page-footer {
            margin-top: 20px;
            padding: 16px 20px;
            text-align: center;
            border-top: 1px solid #ddd;
        }

        .attribution-section {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #ccc;
            font-size: 0.78em;
            color: #444;
            line-height: 1.5;
        }

        .attribution-blocks {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 1050px;
            margin: 0 auto;
        }

        .attribution-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .attribution-inner + .attribution-inner {
            padding-top: 8px;
            border-top: 1px dotted #e2e2e2;
        }

        .attribution-logo {
            display: none;
            max-width: 115px;
            max-height: 52px;
            width: auto;
            height: auto;
            opacity: 0.92;
            object-fit: contain;
        }

        .attribution-logo-vv {
            max-width: 125px;
            max-height: 46px;
        }

        .attribution-text {
            text-align: center;
        }

        .attribution-text a {
            color: #111;
            font-weight: 600;
            text-decoration: underline;
            margin: 0 3px;
        }

        .attribution-text a:hover {
            color: #0d6efd;
        }

        @media screen and (max-width: 1024px) {
            .bottom-grid, .bottom-grid tbody, .bottom-grid tr, .bottom-grid td {
                display: block;
                width: 100% !important;
            }
        }

        .error-banner {
            max-width: 780px;
            margin: 0 auto 18px;
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid #dc2626;
            background: #fef2f2;
            color: #991b1b;
            text-align: center;
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .error-banner .error-code-pill {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 10px;
            border-radius: 6px;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            font-family: Consolas, monospace;
            font-size: 0.82rem;
            font-weight: 700;
        }

        @page {
            size: A4;
            margin: 10mm 12mm;
        }

        @media print {
            audio, .floating-nav, .qr-card { display: none !important; }
            .gallery-menu-popover { display: none !important; }
            html, body {
                margin: 0;
                padding: 0;
                background: #ffffff;
            }
            .container {
                max-width: none;
                width: 100%;
                padding: 0;
                margin: 0;
            }
            .scribble-section {
                min-height: 0;
                margin-bottom: 10px;
            }
            .scribble-container {
                max-width: 460px;
            }
            .scribble-container img {
                width: 90%;
                max-height: 95mm;
            }
            .bottom-grid {
                display: table !important;
                width: 100% !important;
                table-layout: fixed;
                border-spacing: 8px 4px;
                margin-top: 8px;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .bottom-grid tbody {
                display: table-row-group !important;
            }
            .bottom-grid tr {
                display: table-row !important;
            }
            .bottom-grid td {
                display: table-cell !important;
                padding: 12px 14px;
                vertical-align: top;
            }
            .bottom-grid td:first-child {
                width: 55% !important;
            }
            .bottom-grid td:last-child {
                width: 45% !important;
            }
            .visual-metrics-row {
                margin-top: 16px;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .heatmap-container img {
                width: 125px;
                height: 125px;
            }
            .update-info { display: block; }
            .page-footer {
                position: static;
                margin-top: 12px;
                padding: 10px 12px 0;
                background: white;
                border-top: 1px solid #ddd;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .attribution-section {
                margin-top: 8px;
                padding-top: 8px;
            }
            .attribution-blocks {
                gap: 6px;
            }
            .attribution-inner {
                gap: 10px;
            }
            .attribution-inner + .attribution-inner {
                padding-top: 6px;
            }
            .attribution-logo {
                max-width: 90px;
                max-height: 38px;
            }
            .attribution-logo-vv {
                max-width: 105px;
                max-height: 36px;
            }
            .attribution-text a {
                text-decoration: none;
                color: #222;
            }
        }
    </style>
</head>
<body>
    <nav class="floating-nav">
        <a href="/draw?single_screen=1" id="singleScreenDrawBtn" class="gallery-single-draw-btn" style="display: none;" data-i18n="gallery.nav.new_drawing">New Drawing</a>
        <button type="button" id="galleryMenuBtn" class="gallery-menu-btn" onclick="toggleGalleryMenu(event)" data-i18n-title="gallery.nav.menu_title" title="Gallery &amp; Staff Controls" aria-expanded="false">&middot;&middot;&middot;</button>
        <span id="galleryLangSwitch"></span>
    </nav>

    <div class="gallery-menu-popover" id="galleryMenuPopover">
        <div class="gallery-menu-row">
            <button onclick="stepHistory(1)" data-i18n="gallery.nav.prev" data-i18n-title="gallery.nav.prev_title" title="Older Artwork (Left Arrow)">Prev</button>
            <button id="liveModeBtn" class="live-active" onclick="returnToLive()" data-i18n="gallery.nav.live" data-i18n-title="gallery.nav.live_title" title="Return to Live Feed">Live</button>
            <button onclick="stepHistory(-1)" data-i18n="gallery.nav.next" data-i18n-title="gallery.nav.next_title" title="Newer Artwork (Right Arrow)">Next</button>
        </div>
        <a href="/draw" data-i18n="gallery.nav.draw">Gaze Draw</a>
        <a href="/kiosk" data-i18n="gallery.nav.kiosk">Print Kiosk</a>
        <button onclick="window.print()" data-i18n="gallery.nav.print">Print</button>
    </div>

    <div class="container">
        <div id="errorBanner" class="error-banner" style="display: none;"></div>
        <div class="scribble-section">
            <div class="scribble-container">
                <img id="mainScribble" alt="Gaze drawing" style="display: none;">
                <div id="scribblePlaceholder" class="scribble-placeholder" data-i18n-html="gallery.placeholder.first_html">
                    Waiting for the first gaze drawing — open <a href="/draw" style="color: #2a2a2a;">Gaze Draw</a> to begin.
                </div>
            </div>
        </div>

        <header style="text-align: center; margin-bottom: 4px;">
            <h1 style="font-size: 1.5em; font-weight: 400; letter-spacing: 2px; color: #2a2a2a;" data-i18n="gallery.heading">
                Latent Space, Through the Eyes of the Algorithm
            </h1>
            <div id="archetypeContainer" style="display: none;">
                <span class="archetype-badge" id="archetypeBadge"></span>
            </div>
            <div id="translationFallbackNote" class="translation-fallback-note" data-i18n="gallery.translation_fallback_note"></div>
        </header>

        <table class="bottom-grid">
            <tr>
                <td class="grid-item" style="width: 55%;">
                    <h2 class="section-title" data-i18n="gallery.section.analysis">Analysis</h2>
                    <div class="psychoanalysis-text" id="psychoanalysisText"></div>
                </td>

                <td class="grid-item" style="width: 45%;">
                    <h2 class="section-title" data-i18n="gallery.section.poem">Poem</h2>
                    <div class="poem-text" id="poemText"></div>
                    <audio id="poemAudio" controls style="width: 100%; margin-top: 18px; display: none;">
                        <source src="" type="audio/mpeg">
                        <span data-i18n="gallery.audio_unsupported">Your browser does not support the audio element.</span>
                    </audio>

                    <div class="visual-metrics-row">
                        <div id="heatmapSection" style="display: none;">
                            <h2 class="section-title" style="margin-bottom: 10px;" data-i18n="gallery.section.attention">Attention Span</h2>
                            <div class="heatmap-container">
                                <img id="heatmapImage" alt="Heatmap visualization">
                            </div>
                        </div>
                        <div class="qr-card" id="qrCard" style="display: none;">
                            <div id="qrCodeBox"></div>
                            <div class="qr-caption" id="qrCaption" data-i18n="gallery.qr.scan">Scan to save your digital print</div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>

        <footer class="page-footer">
            <div class="update-info">
                <p><span id="lastUpdate">Waiting for data...</span></p>
            </div>

            <div class="attribution-section" id="attributionSection" style="display: none;">
                <div class="attribution-blocks">
                    <div class="attribution-inner" id="vvAttributionRow" style="display: none;">
                        <img id="vvAttributionLogo" class="attribution-logo attribution-logo-vv" alt="Veszprém Vibe Logo" style="display: none;">
                        <div class="attribution-text" id="vvAttributionText"></div>
                    </div>
                    <div class="attribution-inner" id="kasboekAttributionRow" style="display: none;">
                        <img id="attributionLogo" class="attribution-logo" alt="Kasboek Logo" style="display: none;">
                        <div class="attribution-text" id="attributionText"></div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="/i18n.js"></script>
    <script>
        const CONFIG = {
            dataFile: '/shared_output/content.json',
            attributionsApi: '/api/settings/attributions',
            statusApi: '/api/public/info',
            printsApi: '/api/files/prints',
            refreshInterval: 4000,
        };

        const urlParams = new URLSearchParams(window.location.search);
        const isPrintRender = urlParams.get('print_render') === '1';
        const isSingleScreenGallery = urlParams.get('single_screen') === '1';
        const showControlsParam = urlParams.get('controls') === '1';
        const renderRunId = (urlParams.get('run_id') || '').trim();

        if ('serviceWorker' in navigator && typeof navigator.serviceWorker.getRegistrations === 'function') {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => reg.unregister().catch(() => {}));
            }).catch(() => {});
        }

        function toggleGalleryMenu(event) {
            if (event) event.stopPropagation();
            const pop = document.getElementById('galleryMenuPopover');
            const btn = document.getElementById('galleryMenuBtn');
            if (!pop || !btn) return;
            const next = !pop.classList.contains('is-open');
            pop.classList.toggle('is-open', next);
            btn.classList.toggle('is-open', next);
            btn.setAttribute('aria-expanded', next ? 'true' : 'false');
        }

        document.addEventListener('click', (e) => {
            const pop = document.getElementById('galleryMenuPopover');
            const btn = document.getElementById('galleryMenuBtn');
            if (!pop || !pop.classList.contains('is-open')) return;
            if (!pop.contains(e.target) && e.target !== btn) {
                pop.classList.remove('is-open');
                if (btn) {
                    btn.classList.remove('is-open');
                    btn.setAttribute('aria-expanded', 'false');
                }
            }
        });
        let lastContentSignature = null;
        let lastAttrSignature = null;
        let lanBaseUrl = window.location.origin;
        let lastPublicInfoTs = 0;
        let liveRunId = null;
        let lastViewPayload = null;
        let lastViewIsHistorical = false;

        let historyList = [];
        let historyIdx = -1;
        let isSteppingHistory = false;
        let isLoadingContent = false;

        const galleryI18n = window.LS_I18N.createPageController('gallery', {
            titleKey: 'gallery.page_title',
            onChange: () => {
                if (lastViewPayload) {
                    applyViewData(lastViewPayload, lastViewIsHistorical);
                }
            },
        });
        const t = galleryI18n.t;

        function buildPath(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('/')) {
                return path;
            }
            if (path.startsWith('shared_output/')) {
                return '/' + path;
            }
            return '/shared_output/' + path;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function safeUrl(url) {
            const u = String(url ?? '').trim();
            if (/^(https?:\/\/|\/(?!\/))/i.test(u)) return escapeHtml(u);
            return '';
        }

        function parseSafeDate(ts) {
            if (!ts) return null;
            const s = String(ts).trim().replace(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})/, '$1T$2');
            const d = new Date(s);
            return isNaN(d.getTime()) ? null : d;
        }

        function renderQRCode(targetPath, isPdfRendering = false, runId = '', printLanguage = 'en') {
            const qrCard = document.getElementById('qrCard');
            const qrBox = document.getElementById('qrCodeBox');
            const qrCaption = document.getElementById('qrCaption');
            if (isPrintRender || !targetPath) {
                qrCard.style.display = 'none';
                qrBox.innerHTML = '';
                return;
            }
            if (isPdfRendering) {
                qrBox.innerHTML = `<div style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:0.72em;color:#777;">${escapeHtml(t('gallery.qr.preparing'))}</div>`;
                qrCaption.textContent = t('gallery.qr.generating');
                qrCard.style.display = 'flex';
                return;
            }
            qrCaption.textContent = t('gallery.qr.scan');
            const curLang = galleryI18n.getLang();
            const basePrintLang = (printLanguage || 'en').toLowerCase();
            let resolvedPath = targetPath;
            if (runId && curLang !== basePrintLang && /^[A-Za-z0-9_]+$/.test(runId)) {
                resolvedPath = `/api/pdf/${encodeURIComponent(runId)}/${encodeURIComponent(curLang)}`;
            }
            const fullUrl = resolvedPath.startsWith('http')
                ? resolvedPath
                : `${lanBaseUrl}${buildPath(resolvedPath)}`;
            qrBox.innerHTML = `<img src="/api/qr.svg?url=${encodeURIComponent(fullUrl)}" alt="Digital print QR code">`;
            qrCard.style.display = 'flex';
        }

        function renderBadge(archetype, fractalDim, spatialEntropy) {
            const container = document.getElementById('archetypeContainer');
            const badge = document.getElementById('archetypeBadge');
            if (!archetype && typeof fractalDim !== 'number') {
                container.style.display = 'none';
                return;
            }
            let parts = [];
            if (archetype) parts.push(archetype);
            if (typeof fractalDim === 'number') parts.push(t('gallery.badge.fractal', { val: fractalDim.toFixed(2) }));
            if (typeof spatialEntropy === 'number') parts.push(t('gallery.badge.entropy', { val: Math.round(spatialEntropy * 100) }));
            badge.textContent = parts.join('  ·  ');
            container.style.display = 'block';
        }

        function renderAttribution(attr) {
            const section = document.getElementById('attributionSection');
            const kasRow = document.getElementById('kasboekAttributionRow');
            const logo = document.getElementById('attributionLogo');
            const textEl = document.getElementById('attributionText');
            const vvRow = document.getElementById('vvAttributionRow');
            const vvLogo = document.getElementById('vvAttributionLogo');
            const vvTextEl = document.getElementById('vvAttributionText');

            const kasboekOn = !!(attr && attr.enabled);
            const vv = (attr && attr.veszprem_vibe && typeof attr.veszprem_vibe === 'object') ? attr.veszprem_vibe : {};
            const vvOn = !!vv.enabled;

            if (!kasboekOn && !vvOn) {
                section.style.display = 'none';
                kasRow.style.display = 'none';
                logo.style.display = 'none';
                logo.removeAttribute('src');
                textEl.innerHTML = '';
                vvRow.style.display = 'none';
                vvLogo.style.display = 'none';
                vvLogo.removeAttribute('src');
                vvTextEl.innerHTML = '';
                return;
            }

            section.style.display = 'block';

            // 1. Veszprém Vibe Community Attribution
            if (vvOn) {
                vvRow.style.display = 'flex';
                if (vv.show_logo !== false) {
                    const rawVvLogo = String(vv.logo_path || '/assets/veszprem-vibe/vv-skyline-on-paper.svg').trim();
                    const safeVvLogo = /^(https?:\/\/|\/(?!\/))/i.test(rawVvLogo) ? rawVvLogo : '/assets/veszprem-vibe/vv-skyline-on-paper.svg';
                    const sep = safeVvLogo.includes('?') ? '&' : '?';
                    vvLogo.src = safeVvLogo + sep + 't=' + Date.now();
                    vvLogo.style.display = 'block';
                } else {
                    vvLogo.style.display = 'none';
                    vvLogo.removeAttribute('src');
                }

                const vvIntro = escapeHtml(vv.intro_text || 'Created for the Veszprém Vibe community.');
                const vvLearnMore = escapeHtml(vv.learn_more_text || 'Connect with us:');
                const vvWebLabel = escapeHtml(vv.website_label || 'veszpremvibe.hu');
                const vvWebUrl = safeUrl(vv.website_url || '');
                const vvLiLabel = escapeHtml(vv.linkedin_label || 'LinkedIn');
                const vvLiUrl = safeUrl(vv.linkedin_url || '');
                const vvFbLabel = escapeHtml(vv.facebook_label || 'Facebook');
                const vvFbUrl = safeUrl(vv.facebook_url || '');

                let vvLinks = [];
                if (vvWebUrl) {
                    vvLinks.push(`<a href="${vvWebUrl}" target="_blank" rel="noopener noreferrer">${vvWebLabel}</a>`);
                }
                if (vvLiUrl) {
                    vvLinks.push(`<a href="${vvLiUrl}" target="_blank" rel="noopener noreferrer">${vvLiLabel}</a>`);
                }
                if (vvFbUrl) {
                    vvLinks.push(`<a href="${vvFbUrl}" target="_blank" rel="noopener noreferrer">${vvFbLabel}</a>`);
                }

                let vvHtml = `<div><strong>${vvIntro}</strong>`;
                if (vvLinks.length > 0) {
                    vvHtml += ` ${vvLearnMore} ${vvLinks.join(' &middot; ')}`;
                }
                vvHtml += `</div>`;
                if (vv.custom_note && vv.custom_note.trim()) {
                    vvHtml += `<div style="margin-top: 3px; font-style: italic;">${escapeHtml(vv.custom_note.trim())}</div>`;
                }
                vvTextEl.innerHTML = vvHtml;
            } else {
                vvRow.style.display = 'none';
                vvLogo.style.display = 'none';
                vvLogo.removeAttribute('src');
                vvTextEl.innerHTML = '';
            }

            // 2. Kasboek Attribution
            if (kasboekOn) {
                kasRow.style.display = 'flex';
                if (attr.show_logo !== false) {
                    const rawLogo = String(attr.logo_path || '/assets/kasboek/kasboek-logo.jpg').trim();
                    const safeLogo = /^(https?:\/\/|\/(?!\/))/i.test(rawLogo) ? rawLogo : '/assets/kasboek/kasboek-logo.jpg';
                    const sep = safeLogo.includes('?') ? '&' : '?';
                    logo.src = safeLogo + sep + 't=' + Date.now();
                    logo.style.display = 'block';
                } else {
                    logo.style.display = 'none';
                    logo.removeAttribute('src');
                }

                const intro = escapeHtml(attr.intro_text || 'Made possible by Kasboek.');
                const learnMore = escapeHtml(attr.learn_more_text || 'To learn more, visit');
                const webLabel = escapeHtml(attr.website_label || 'Kasboek Website');
                const webUrl = safeUrl(attr.website_url || '');
                const liLabel = escapeHtml(attr.company_linkedin_label || 'Kasboek LinkedIn');
                const liUrl = safeUrl(attr.company_linkedin_url || '');
                const thanksText = escapeHtml(attr.thanks_text || 'Thank you for letting us use this:');

                let linksHtml = [];
                if (webUrl) {
                    linksHtml.push(`<a href="${webUrl}" target="_blank" rel="noopener noreferrer">${webLabel}</a>`);
                }
                if (liUrl) {
                    linksHtml.push(`<a href="${liUrl}" target="_blank" rel="noopener noreferrer">${liLabel}</a>`);
                }

                let foundersHtml = [];
                if (Array.isArray(attr.founders)) {
                    for (const f of attr.founders) {
                        if (f && f.name && f.name.trim()) {
                            const fName = escapeHtml(f.name.trim());
                            const fUrl = f.url ? safeUrl(f.url) : '';
                            if (fUrl) {
                                foundersHtml.push(`<a href="${fUrl}" target="_blank" rel="noopener noreferrer">${fName}</a>`);
                            } else {
                                foundersHtml.push(`<span>${fName}</span>`);
                            }
                        }
                    }
                }

                let html = `<div><strong>${intro}</strong>`;
                if (linksHtml.length > 0) {
                    html += ` ${learnMore} ${linksHtml.join(' &middot; ')}.`;
                }
                html += `</div>`;

                if (foundersHtml.length > 0) {
                    html += `<div style="margin-top: 3px;">${thanksText} ${foundersHtml.join(' &middot; ')}</div>`;
                }

                if (attr.custom_footer_note && attr.custom_footer_note.trim()) {
                    html += `<div style="margin-top: 3px; font-style: italic;">${escapeHtml(attr.custom_footer_note.trim())}</div>`;
                }

                textEl.innerHTML = html;
            } else {
                kasRow.style.display = 'none';
                logo.style.display = 'none';
                logo.removeAttribute('src');
                textEl.innerHTML = '';
            }
        }

        async function refreshAttributions() {
            try {
                const attrRes = await fetch(CONFIG.attributionsApi + '?t=' + Date.now());
                if (attrRes.ok) {
                    const attrData = await attrRes.json();
                    const attrSig = JSON.stringify(attrData);
                    if (attrSig !== lastAttrSignature) {
                        lastAttrSignature = attrSig;
                        renderAttribution(attrData);
                    }
                }
            } catch (_) {}
        }

        function clearArtworkView(placeholderText) {
            const scribbleEl = document.getElementById('mainScribble');
            const placeholderEl = document.getElementById('scribblePlaceholder');
            scribbleEl.style.display = 'none';
            scribbleEl.removeAttribute('src');
            placeholderEl.textContent = placeholderText || '';
            placeholderEl.style.display = placeholderText ? 'block' : 'none';

            const hmSection = document.getElementById('heatmapSection');
            const hmImg = document.getElementById('heatmapImage');
            hmImg.removeAttribute('src');
            hmSection.style.display = 'none';

            document.getElementById('archetypeContainer').style.display = 'none';
            document.getElementById('translationFallbackNote').style.display = 'none';
            document.getElementById('psychoanalysisText').textContent = '';
            document.getElementById('poemText').textContent = '';

            const poemAudio = document.getElementById('poemAudio');
            poemAudio.pause();
            poemAudio.removeAttribute('src');
            delete poemAudio.dataset.audioPath;
            poemAudio.style.display = 'none';

            renderQRCode('');
        }

        function applyViewData(data, isHistorical = false) {
            lastViewPayload = data;
            lastViewIsHistorical = isHistorical;
            const errorBanner = document.getElementById('errorBanner');
            if (!isHistorical && data.status === 'empty') {
                errorBanner.style.display = 'none';
                errorBanner.innerHTML = '';
                clearArtworkView(t('gallery.placeholder.first'));
                document.getElementById('lastUpdate').textContent = t('gallery.waiting_data');
                return;
            }
            if (!isHistorical && data.status === 'error') {
                const code = escapeHtml(data.errorCode || 'ERR_PIPELINE_FAILED');
                const msg = escapeHtml(
                    data.userMessage || t('gallery.error.default_msg')
                );
                errorBanner.innerHTML =
                    `<div><strong>${escapeHtml(t('gallery.error.title'))}</strong> — ${msg}</div>` +
                    `<div class="error-code-pill">${code}</div>`;
                errorBanner.style.display = 'block';
                clearArtworkView('');
                const errDate = parseSafeDate(data.timestamp);
                document.getElementById('lastUpdate').textContent = errDate
                    ? galleryI18n.formatDateTime(errDate)
                    : t('gallery.error.date_fallback');
                return;
            }

            errorBanner.style.display = 'none';
            errorBanner.innerHTML = '';

            const scribbleEl = document.getElementById('mainScribble');
            const placeholderEl = document.getElementById('scribblePlaceholder');
            if (data.scribblePath) {
                scribbleEl.src = buildPath(data.scribblePath) + '?t=' + encodeURIComponent(data.timestamp || Date.now());
                scribbleEl.style.display = 'block';
                placeholderEl.style.display = 'none';
            } else {
                scribbleEl.style.display = 'none';
                scribbleEl.removeAttribute('src');
                placeholderEl.textContent = isHistorical ? t('gallery.placeholder.no_preview') : t('gallery.placeholder.waiting');
                placeholderEl.style.display = 'block';
            }

            const hmSection = document.getElementById('heatmapSection');
            const hmImg = document.getElementById('heatmapImage');
            if (data.heatmapPath) {
                hmImg.src = buildPath(data.heatmapPath) + '?t=' + encodeURIComponent(data.timestamp || Date.now());
                hmSection.style.display = 'block';
            } else {
                hmImg.removeAttribute('src');
                hmSection.style.display = 'none';
            }

            const loc = galleryI18n.pickContent(data);
            renderBadge(loc.archetype, data.fractalDimension, data.spatialEntropy);

            const fbNote = document.getElementById('translationFallbackNote');
            fbNote.style.display = (!isPrintRender && loc.isFallback) ? 'block' : 'none';

            document.getElementById('psychoanalysisText').textContent = loc.psychoanalysis || (isHistorical ? t('gallery.archive.fallback_analysis') : '');
            document.getElementById('poemText').textContent = loc.poem || '';

            const poemAudio = document.getElementById('poemAudio');
            const nextAudioSrc = (data.poemAudio && !isHistorical) ? buildPath(data.poemAudio) : '';
            if (nextAudioSrc) {
                if (poemAudio.dataset.audioPath !== nextAudioSrc) {
                    poemAudio.dataset.audioPath = nextAudioSrc;
                    poemAudio.style.display = 'block';
                    poemAudio.src = nextAudioSrc + '?t=' + Date.now();
                    poemAudio.load();
                    poemAudio.play().catch(() => {});
                }
            } else {
                poemAudio.pause();
                poemAudio.removeAttribute('src');
                delete poemAudio.dataset.audioPath;
                poemAudio.style.display = 'none';
            }

            renderQRCode(data.printPDF || '', !!data.pdfRendering, data.runId || '', data.printLanguage || 'en');

            if (data.timestamp) {
                const updateDate = parseSafeDate(data.timestamp);
                const formatted = updateDate ? galleryI18n.formatDateTime(updateDate) : String(data.timestamp);
                document.getElementById('lastUpdate').textContent = isHistorical
                    ? t('gallery.archive.prefix', { idx: historyIdx + 1, total: historyList.length, date: formatted })
                    : formatted;
            }
        }

        async function stepHistory(delta) {
            if (isSteppingHistory) return;
            isSteppingHistory = true;
            const wasLive = (historyIdx === -1);
            try {
                try {
                    const res = await fetch(CONFIG.printsApi + '?t=' + Date.now());
                    if (res.ok) {
                        const prints = await res.json();
                        historyList = prints.filter(p => p.poem || p.psychoanalysis || p.thumb_url);
                    }
                } catch (_) {}

                if (!historyList.length) return;
                let nextIdx = historyIdx + delta;
                const firstIsLive = Boolean(liveRunId && historyList[0] && historyList[0].run_id === liveRunId);
                if (wasLive && delta > 0 && firstIsLive && historyList.length > 1) {
                    nextIdx = 1;
                }
                if (nextIdx < 0 || (delta < 0 && nextIdx === 0 && firstIsLive)) {
                    returnToLive();
                    return;
                }
                historyIdx = Math.min(historyList.length - 1, nextIdx);
                document.getElementById('liveModeBtn').classList.remove('live-active');

                const item = historyList[historyIdx];
                const itemTs = item.timestamp ? new Date(item.timestamp * 1000).toISOString() : item.date;
                applyViewData({
                    runId: item.run_id || '',
                    scribblePath: item.thumb_url,
                    heatmapPath: item.heatmap_url || '',
                    archetype: item.archetype,
                    fractalDimension: item.fractalDimension,
                    spatialEntropy: item.spatialEntropy,
                    psychoanalysis: item.psychoanalysis || '',
                    poem: item.poem || '',
                    translations: item.translations || {},
                    languages: item.languages || ['en'],
                    printLanguage: item.print_language || 'en',
                    printPDF: item.pdf_url,
                    pdfRendering: false,
                    timestamp: itemTs,
                }, true);
            } finally {
                isSteppingHistory = false;
            }
        }

        function returnToLive() {
            historyIdx = -1;
            lastContentSignature = null;
            document.getElementById('liveModeBtn').classList.add('live-active');
            loadContent();
        }

        async function loadContent() {
            if (isLoadingContent) return;
            isLoadingContent = true;
            try {
                await refreshAttributions();
                if (historyIdx !== -1) return;
                const nowMs = Date.now();
                if (!lastPublicInfoTs || (nowMs - lastPublicInfoTs) >= 30000) {
                    try {
                        const st = await fetch(CONFIG.statusApi);
                        if (st.ok) {
                            lastPublicInfoTs = nowMs;
                            const stJson = await st.json();
                            const pageHost = window.location.hostname;
                            const isLocalOrigin = pageHost === 'localhost' || pageHost === '127.0.0.1' || pageHost === '[::1]' || pageHost === '::1';
                            const isSelfSignedHttps = window.location.protocol === 'https:';
                            const hasCustomRemote = stJson.lan_url && stJson.local_lan_url && stJson.lan_url !== stJson.local_lan_url;
                            if (stJson.lan_url && (isLocalOrigin || hasCustomRemote || isSelfSignedHttps)) {
                                lanBaseUrl = stJson.lan_url;
                            } else if (!isLocalOrigin && !hasCustomRemote) {
                                lanBaseUrl = window.location.origin;
                            }
                        }
                    } catch (_) {}
                }

                const dataUrl = (isPrintRender && renderRunId && /^[A-Za-z0-9_]+$/.test(renderRunId))
                    ? `/shared_output/docs/print_${encodeURIComponent(renderRunId)}.json?t=${Date.now()}`
                    : `${CONFIG.dataFile}?t=${Date.now()}`;
                const response = await fetch(dataUrl);
                if (response.ok) {
                    const data = await response.json();
                    liveRunId = data.runId || null;
                    const sig = JSON.stringify({
                        st: data.status,
                        ec: data.errorCode,
                        s: data.scribblePath,
                        h: data.heatmapPath,
                        p: data.psychoanalysis,
                        m: data.poem,
                        tr: data.translations || null,
                        pa: data.poemAudio,
                        pdf: data.printPDF,
                        pl: data.printLanguage || 'en',
                        pr: !!data.pdfRendering,
                        t: data.timestamp,
                        base: lanBaseUrl,
                        lang: galleryI18n.getLang()
                    });

                    if (sig !== lastContentSignature) {
                        lastContentSignature = sig;
                        applyViewData(data, false);
                    }
                }
            } catch (error) {
                console.log('Waiting for content update:', error.message);
            } finally {
                isLoadingContent = false;
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'p' || event.key === 'P') {
                event.preventDefault();
                window.print();
            } else if (event.key === 'ArrowLeft') {
                stepHistory(1);
            } else if (event.key === 'ArrowRight') {
                stepHistory(-1);
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            galleryI18n.mountSwitcher(document.getElementById('galleryLangSwitch'), 'gallery');
            galleryI18n.applyDOM();
            if (isSingleScreenGallery && !isPrintRender) {
                const drawBtn = document.getElementById('singleScreenDrawBtn');
                if (drawBtn) drawBtn.style.display = 'inline-flex';
            }
            if (showControlsParam && !isPrintRender) {
                toggleGalleryMenu();
            }
            loadContent();
            if (!isPrintRender) {
                setInterval(loadContent, CONFIG.refreshInterval);
            }
        });
    </script>
</body>
