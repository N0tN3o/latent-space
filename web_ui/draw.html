<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Space — Browser Gaze Painter</title>
    <style>
        :root {
            --bg: #0f1116;
            --panel: #181b22;
            --border: #2b303c;
            --accent: #10b981;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn, select.btn-select {
            background: #252934;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn:hover, select.btn-select:hover {
            background: #323846;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .canvas-shell {
            position: relative;
            width: 100%;
            max-width: 1120px;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
            border: 2px solid var(--border);
            touch-action: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #cursorCanvas {
            pointer-events: none;
        }

        .pip-box {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 240px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 20;
        }

        .pip-header {
            padding: 6px 10px;
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .pip-video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
        }

        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #eyeOverlayCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .instructions-bar {
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.88rem;
            text-align: center;
        }

        .draw-error-banner {
            display: none;
            width: 100%;
            max-width: 1120px;
            margin-bottom: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid #ef4444;
            color: #fecaca;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="title-group">
            <h2 style="font-size: 1.2rem;" data-i18n="draw.heading">Latent Space — Gaze Painter</h2>
            <span class="status-badge" id="statusBadge">Ready (Move eyes or mouse/touch to draw)</span>
        </div>
        <div class="controls">
            <span id="drawLangSwitch"></span>
            <button class="btn" id="camBtn" onclick="startWebcamGaze()" data-i18n="draw.btn.start_cam">Start Webcam Eye Tracking</button>
            <button class="btn" id="centerBtn" onclick="recenterCursorNow()" style="display:none;" data-i18n="draw.btn.center" data-i18n-title="draw.btn.center_title" title="Press Spacebar anytime while drawing to re-center the cursor to your current gaze">Center Cursor [Space]</button>
            <button class="btn" id="calibBtn" onclick="startCalibration()" style="display:none;" data-i18n="draw.btn.recalibrate">Recalibrate</button>
            <button class="btn" id="modeBtn" onclick="toggleGazeMode()" data-i18n-title="draw.btn.mode_title" title="Switch between Anti-Snap Direct mapping and Gaze Flow Steering">Mode: Stabilized Direct</button>
            <select class="btn-select" id="brushTheme" data-i18n-title="draw.brush.title" title="Brush Ink Style">
                <option value="classic" data-i18n="draw.brush.classic">Classic Obsidian Ink</option>
                <option value="ember" data-i18n="draw.brush.ember">Velocity Ember</option>
                <option value="indigo" data-i18n="draw.brush.indigo">Midnight Indigo</option>
            </select>
            <button class="btn" onclick="startTimedSession()" data-i18n="draw.btn.session_15s">15s Session</button>
            <button class="btn" onclick="clearCanvas()" data-i18n="draw.btn.clear">Clear</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitDrawing()" data-i18n="draw.btn.submit">Submit &amp; Analyze</button>
            <a href="/" class="btn" data-i18n="draw.btn.gallery">Gallery</a>
            <a href="/kiosk" class="btn" data-i18n="draw.btn.kiosk">Kiosk</a>
        </div>
    </header>

    <div class="workspace">
        <div class="draw-error-banner" id="drawErrorBanner"></div>
        <div class="canvas-shell">
            <canvas id="artCanvas" width="1280" height="720"></canvas>
            <canvas id="cursorCanvas" width="1280" height="720"></canvas>
        </div>
        <div class="instructions-bar" id="helperText" data-i18n-html="draw.helper_html">
            Tip: Press <strong>Spacebar</strong> while drawing to re-center the cursor to your current gaze (especially helpful when wearing glasses).
        </div>
    </div>

    <div class="pip-box" id="pipBox" style="display:none;">
        <div class="pip-header">
            <span id="pipStatus" data-i18n="draw.pip.title">Eye Tracker Feed</span>
            <span id="fpsCounter">0 FPS</span>
        </div>
        <div class="pip-video-wrap">
            <video id="webcamVideo" autoplay playsinline muted></video>
            <canvas id="eyeOverlayCanvas" width="320" height="240"></canvas>
        </div>
    </div>

    <script src="/i18n.js"></script>
    <script type="module">
        // Unregister any stale service worker left on this origin (e.g. another app previously run on port 8000)
        // so it cannot intercept /vendor/mediapipe/* or /api/* requests with broken FetchEvent handlers.
        if ('serviceWorker' in navigator && typeof navigator.serviceWorker.getRegistrations === 'function') {
            navigator.serviceWorker.getRegistrations().then(async (regs) => {
                if (!regs.length) return;
                await Promise.all(regs.map((reg) => reg.unregister()));
                if (navigator.serviceWorker.controller && !sessionStorage.getItem('ls_sw_unregistered')) {
                    sessionStorage.setItem('ls_sw_unregistered', '1');
                    window.location.reload();
                }
            }).catch(() => {});
        }

        const artCanvas = document.getElementById('artCanvas');
        const artCtx = artCanvas.getContext('2d');
        const cursorCanvas = document.getElementById('cursorCanvas');
        const cursorCtx = cursorCanvas.getContext('2d');
        const statusBadge = document.getElementById('statusBadge');

        let lastStatusKey = 'draw.status.ready';
        let lastStatusVars = null;
        let camBtnState = 'idle'; // 'idle' | 'loading' | 'active'

        const drawI18n = window.LS_I18N.createPageController('draw', {
            titleKey: 'draw.page_title',
            onChange: () => {
                refreshDynamicDrawText();
            },
        });
        const t = drawI18n.t;

        function setStatusKey(key, vars = null) {
            lastStatusKey = key;
            lastStatusVars = vars;
            statusBadge.textContent = t(key, vars);
        }

        function refreshDynamicDrawText() {
            statusBadge.textContent = t(lastStatusKey, lastStatusVars);
            const modeBtn = document.getElementById('modeBtn');
            if (modeBtn) {
                modeBtn.textContent = gazeControlMode === 'hybrid'
                    ? t('draw.btn.mode_hybrid')
                    : t('draw.btn.mode_flow');
            }
            const camBtn = document.getElementById('camBtn');
            if (camBtn) {
                camBtn.textContent = camBtnState === 'active'
                    ? t('draw.btn.cam_active')
                    : (camBtnState === 'loading' ? t('draw.btn.loading_cam') : t('draw.btn.start_cam'));
            }
            const subBtn = document.getElementById('submitBtn');
            if (subBtn) {
                subBtn.textContent = subBtn.disabled ? t('draw.btn.submitting') : t('draw.btn.submit');
            }
        }

        const W = 1280;
        const H = 720;
        let dwellGrid = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];

        function resetDwellGrid() {
            dwellGrid = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
        }

        function resetArtCanvas() {
            artCtx.fillStyle = '#ffffff';
            artCtx.fillRect(0, 0, W, H);
            resetDwellGrid();
        }
        resetArtCanvas();

        let prevPoint = null;
        let prevTime = performance.now();
        let dwellTime = 0;
        let hasDrawn = false;
        const dwellRadius = 0.03;

        const STATES = {
            IDLE: 'IDLE',
            SEARCHING: 'SEARCHING',
            CALIBRATING: 'CALIBRATING',
            DRAWING: 'DRAWING',
            SUBMITTING: 'SUBMITTING',
        };
        let gazeState = STATES.IDLE;
        let sessionTimerId = null;
        let timedEndTimestamp = 0;
        let activePollId = 0;
        let pendingPostSubmitTimerId = null;

        let gazeControlMode = 'hybrid';
        let cursorPos = [0.5, 0.5];

        // --- MediaPipe FaceLandmarker state ---
        let faceLandmarker = null;
        let webcamRunning = false;
        let lastGazeTs = 0;
        let lastPointerTs = 0;
        let faceStreak = 0;
        const CONSECUTIVE_FACE_FRAMES = 5;
        const GAZE_LOSS_TIMEOUT_MS = 2000;
        const CALIB_DURATION_MS = 4500;
        const CALIB_STEP1_RATIO = 0.33;
        const CALIB_STEP2_SKIP_MS = 200;
        const DEFAULT_BLINK_EAR_THR = 0.135;
        const ROLLING_BUFFER = 7;
        const SMOOTH_ALPHA = 0.55;
        let calibStartTs = 0;
        let calibSamples = [];
        let calibTargets = [];
        let centerSamples = [];
        let earSamples = [];
        let blinkEarThr = DEFAULT_BLINK_EAR_THR;
        let centerNorm = [0.0, 0.0];
        let weightsX = [0.0, 9.0, 0.0];
        let weightsY = [0.0, 0.0, 13.0];
        let normBuffer = [];
        let smoothedNorm = null;
        let leftHist = [];
        let rightHist = [];

        function median1D(values) {
            if (!values || !values.length) return 0.0;
            const sorted = [...values].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return (sorted.length % 2 === 1) ? sorted[mid] : 0.5 * (sorted[mid - 1] + sorted[mid]);
        }

        function clearSessionTimer() {
            if (sessionTimerId !== null) {
                clearInterval(sessionTimerId);
                sessionTimerId = null;
            }
        }

        function cancelActiveSubmission() {
            activePollId++;
            if (pendingPostSubmitTimerId !== null) {
                clearTimeout(pendingPostSubmitTimerId);
                pendingPostSubmitTimerId = null;
            }
            const btn = document.getElementById('submitBtn');
            btn.disabled = false;
            btn.textContent = t('draw.btn.submit');
        }

        function showDrawError(errorCode, message) {
            const banner = document.getElementById('drawErrorBanner');
            const codeText = errorCode ? `[${errorCode}] ` : '';
            banner.textContent = `${codeText}${message || t('draw.err.default')}`;
            banner.style.display = 'block';
        }

        function hideDrawError() {
            const banner = document.getElementById('drawErrorBanner');
            banner.style.display = 'none';
            banner.textContent = '';
        }

        function resetVisitorTrackingState() {
            blinkEarThr = DEFAULT_BLINK_EAR_THR;
            normBuffer = [];
            smoothedNorm = null;
            leftHist = [];
            rightHist = [];
            centerNorm = [0.0, 0.0];
            weightsX = [0.0, 9.0, 0.0];
            weightsY = [0.0, 0.0, 13.0];
            cursorPos = [0.5, 0.5];
            faceStreak = 0;
        }

        function setState(nextState) {
            if (nextState !== STATES.DRAWING) {
                clearSessionTimer();
            }
            if (gazeState === STATES.SUBMITTING && nextState !== STATES.SUBMITTING) {
                cancelActiveSubmission();
            }
            gazeState = nextState;

            if (nextState === STATES.IDLE) {
                cursorCtx.clearRect(0, 0, W, H);
                prevPoint = null;
            } else if (nextState === STATES.SEARCHING) {
                calibSamples = [];
                calibTargets = [];
                centerSamples = [];
                earSamples = [];
                calibStartTs = 0;
                lastPointerTs = 0;
                resetVisitorTrackingState();
                cursorCtx.clearRect(0, 0, W, H);
                prevPoint = null;
                setStatusKey('draw.status.searching');
            } else if (nextState === STATES.CALIBRATING) {
                hideDrawError();
                resetArtCanvas();
                hasDrawn = false;
                calibSamples = [];
                calibTargets = [];
                centerSamples = [];
                earSamples = [];
                lastPointerTs = 0;
                resetVisitorTrackingState();
                calibStartTs = performance.now();
                prevPoint = null;
                drawCalibrationTarget(0);
                setStatusKey('draw.status.calibrating_start');
            } else if (nextState === STATES.DRAWING) {
                hideDrawError();
                prevPoint = null;
                prevTime = performance.now();
                cursorCtx.clearRect(0, 0, W, H);
            } else if (nextState === STATES.SUBMITTING) {
                cursorCtx.clearRect(0, 0, W, H);
                prevPoint = null;
            }
        }

        window.toggleGazeMode = function() {
            gazeControlMode = (gazeControlMode === 'hybrid') ? 'flow' : 'hybrid';
            const btn = document.getElementById('modeBtn');
            btn.textContent = gazeControlMode === 'hybrid'
                ? t('draw.btn.mode_hybrid')
                : t('draw.btn.mode_flow');
        };

        function getStrokeColor(speedFactor) {
            const theme = document.getElementById('brushTheme').value;
            if (theme === 'ember') {
                const r = Math.min(220, Math.floor(40 + speedFactor * 180));
                const g = Math.floor(speedFactor * 45);
                return `rgb(${r}, ${g}, 10)`;
            } else if (theme === 'indigo') {
                const b = Math.min(200, Math.floor(45 + speedFactor * 155));
                const r = Math.floor(speedFactor * 40);
                return `rgb(${r}, 15, ${b})`;
            }
            const shade = Math.min(75, Math.floor(speedFactor * 55));
            return `rgb(${shade}, 0, 0)`;
        }

        function calibrationTargetAtProgress(pct) {
            const p = Math.max(0, Math.min(100, pct));
            if (p <= 33) {
                return [0.5, 0.5];
            }
            const angle = ((p - 33) / 67.0) * Math.PI * 2.0;
            return [0.5 + 0.36 * Math.cos(angle), 0.5 + 0.34 * Math.sin(angle)];
        }

        function drawCalibrationTarget(pct) {
            cursorCtx.clearRect(0, 0, W, H);
            const [normTx, normTy] = calibrationTargetAtProgress(pct);
            const tx = W * normTx;
            const ty = H * normTy;
            let instruction = t('draw.calib.step1');

            if (pct > 33) {
                instruction = t('draw.calib.step2');

                cursorCtx.strokeStyle = '#e5e7eb';
                cursorCtx.lineWidth = 1.5;
                cursorCtx.beginPath();
                cursorCtx.ellipse(W * 0.5, H * 0.5, W * 0.36, H * 0.34, 0, 0, Math.PI * 2);
                cursorCtx.stroke();
            }

            cursorCtx.strokeStyle = '#10b981';
            cursorCtx.lineWidth = 3;
            cursorCtx.beginPath();
            cursorCtx.arc(tx, ty, 28, 0, Math.PI * 2);
            cursorCtx.stroke();

            cursorCtx.lineWidth = 1.2;
            cursorCtx.beginPath();
            cursorCtx.moveTo(tx - 38, ty);
            cursorCtx.lineTo(tx + 38, ty);
            cursorCtx.moveTo(tx, ty - 38);
            cursorCtx.lineTo(tx, ty + 38);
            cursorCtx.stroke();

            cursorCtx.fillStyle = '#10b981';
            cursorCtx.beginPath();
            cursorCtx.arc(tx, ty, 8, 0, Math.PI * 2);
            cursorCtx.fill();

            const barW = W * 0.5;
            const barH = 10;
            const barX = (W - barW) * 0.5;
            const barY = H - 46;
            cursorCtx.fillStyle = '#e5e7eb';
            cursorCtx.fillRect(barX, barY, barW, barH);
            cursorCtx.fillStyle = '#10b981';
            cursorCtx.fillRect(barX, barY, barW * (Math.max(0, Math.min(100, pct)) / 100.0), barH);

            cursorCtx.fillStyle = '#111827';
            cursorCtx.font = '600 18px Segoe UI, sans-serif';
            cursorCtx.textAlign = 'center';
            cursorCtx.fillText(t('draw.calib.canvas_label', { pct, instruction }), W * 0.5, barY - 14);
        }

        function updateStroke(normX, normY) {
            const now = performance.now();
            const dt = Math.max(0.001, (now - prevTime) / 1000.0);
            prevTime = now;

            const gx = Math.max(0, Math.min(W, normX * W));
            const gy = Math.max(0, Math.min(H, normY * H));
            const curPoint = { x: gx, y: gy };

            const col = Math.min(2, Math.max(0, Math.floor(Math.max(0, Math.min(0.9999, normX)) * 3)));
            const row = Math.min(2, Math.max(0, Math.floor(Math.max(0, Math.min(0.9999, normY)) * 3)));
            dwellGrid[row][col] += Math.min(dt, 0.25);

            cursorCtx.clearRect(0, 0, W, H);
            cursorCtx.strokeStyle = gazeControlMode === 'flow' ? '#3b82f6' : '#10b981';
            cursorCtx.lineWidth = 1.5;
            cursorCtx.beginPath();
            cursorCtx.moveTo(gx - 18, gy);
            cursorCtx.lineTo(gx + 18, gy);
            cursorCtx.moveTo(gx, gy - 18);
            cursorCtx.lineTo(gx, gy + 18);
            cursorCtx.stroke();
            cursorCtx.beginPath();
            cursorCtx.arc(gx, gy, 7, 0, Math.PI * 2);
            cursorCtx.stroke();

            if (!prevPoint) {
                prevPoint = curPoint;
                dwellTime = 0;
                return;
            }

            const dx = (curPoint.x - prevPoint.x) / W;
            const dy = (curPoint.y - prevPoint.y) / H;
            const dist = Math.hypot(dx, dy);

            if (dist < dwellRadius) {
                dwellTime += dt;
            } else {
                dwellTime = 0;
            }

            const baseWidth = 2;
            const dwellBonus = Math.min(20, Math.floor(dwellTime * 10));
            const speedFactor = Math.max(0.2, Math.min(1.0, dist * 50));
            let lineWidth = Math.floor((baseWidth + dwellBonus) * (2.0 - speedFactor));
            lineWidth = Math.max(1, Math.min(36, lineWidth));

            artCtx.lineCap = 'round';
            artCtx.lineJoin = 'round';
            const strokeColor = getStrokeColor(speedFactor);
            artCtx.strokeStyle = strokeColor;
            artCtx.lineWidth = lineWidth;

            artCtx.beginPath();
            artCtx.moveTo(prevPoint.x, prevPoint.y);
            artCtx.lineTo(curPoint.x, curPoint.y);
            artCtx.stroke();

            artCtx.fillStyle = strokeColor;
            artCtx.beginPath();
            artCtx.arc(curPoint.x, curPoint.y, Math.max(1, lineWidth / 2), 0, Math.PI * 2);
            artCtx.fill();

            hasDrawn = true;
            prevPoint = curPoint;
        }

        // Pointer / Touch drawing support (explicitly gated by state machine)
        let pointerDown = false;
        function canAcceptPointerStroke() {
            return gazeState === STATES.IDLE || gazeState === STATES.DRAWING;
        }
        function getNormFromEvent(e) {
            const rect = artCanvas.getBoundingClientRect();
            const touch = (e.touches && e.touches.length > 0)
                ? e.touches[0]
                : ((e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0] : null);
            const clientX = touch ? touch.clientX : e.clientX;
            const clientY = touch ? touch.clientY : e.clientY;
            return {
                x: (clientX - rect.left) / rect.width,
                y: (clientY - rect.top) / rect.height
            };
        }
        function stopPointer() {
            if (pointerDown) {
                const nowTs = performance.now();
                lastGazeTs = nowTs;
                lastPointerTs = nowTs;
            }
            pointerDown = false;
            prevPoint = null;
        }

        artCanvas.addEventListener('mousedown', (e) => {
            if (!canAcceptPointerStroke()) return;
            if (gazeState === STATES.IDLE) {
                setState(STATES.DRAWING);
                setStatusKey('draw.status.drawing_pointer');
            }
            const nowTs = performance.now();
            lastGazeTs = nowTs;
            lastPointerTs = nowTs;
            pointerDown = true;
            prevPoint = null;
            prevTime = nowTs;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        });
        artCanvas.addEventListener('mousemove', (e) => {
            if (!pointerDown || gazeState !== STATES.DRAWING) return;
            const nowTs = performance.now();
            lastGazeTs = nowTs;
            lastPointerTs = nowTs;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        });
        window.addEventListener('mouseup', stopPointer);

        artCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!canAcceptPointerStroke()) return;
            if (gazeState === STATES.IDLE) {
                setState(STATES.DRAWING);
                setStatusKey('draw.status.drawing_pointer');
            }
            const nowTs = performance.now();
            lastGazeTs = nowTs;
            lastPointerTs = nowTs;
            pointerDown = true;
            prevPoint = null;
            prevTime = nowTs;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        }, { passive: false });
        artCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!pointerDown || gazeState !== STATES.DRAWING) return;
            const nowTs = performance.now();
            lastGazeTs = nowTs;
            lastPointerTs = nowTs;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        }, { passive: false });
        window.addEventListener('touchend', stopPointer);
        window.addEventListener('touchcancel', stopPointer);
        window.addEventListener('blur', stopPointer);

        window.clearCanvas = function() {
            clearSessionTimer();
            hideDrawError();
            resetArtCanvas();
            cursorCtx.clearRect(0, 0, W, H);
            prevPoint = null;
            hasDrawn = false;
            cursorPos = [0.5, 0.5];
            if (gazeState === STATES.SUBMITTING || gazeState === STATES.IDLE) {
                setState(webcamRunning ? STATES.SEARCHING : STATES.IDLE);
                if (!webcamRunning) setStatusKey('draw.status.cleared');
            } else if (gazeState === STATES.CALIBRATING) {
                setState(STATES.CALIBRATING);
            } else if (gazeState === STATES.SEARCHING) {
                setStatusKey('draw.status.cleared_searching');
            } else if (gazeState === STATES.DRAWING) {

                setStatusKey('draw.status.cleared');

        };

        window.startTimedSession = function() {

            sessionTimerId = setInterval(() => {
                if (gazeState !== STATES.DRAWING) {

        async function verifyRunFromContentJson(submittedRunId) {
            try {
                const cRes = await fetch('/shared_output/content.json?t=' + Date.now());
                if (!cRes.ok) return null;
                const cData = await cRes.json();
                if (cData.runId === submittedRunId) {
                    return cData;
                }
            } catch (_) {}
            return null;

        async function pollPipelineUntilDone(submittedRunId, pollId) {
            const btn = document.getElementById('submitBtn');
            for (let i = 0; i < 135; i++) {
                await new Promise(r => setTimeout(r, 1200));
                if (pollId !== activePollId) return;
                try {
                    const res = await fetch(`/api/pipeline/status?run_id=${encodeURIComponent(submittedRunId)}&t=${Date.now()}`);
                    if (pollId !== activePollId) return;
                    const state = await res.json();
                    const run = state.run || null;

                    let done = false;
                    let isError = false;
                    let errCode = null;
                    let errMsg = null;

                    if (run) {
                        if (run.state === 'COMPLETED') {
                            done = true;
                        } else if (run.state === 'ERROR') {
                            done = true;
                            isError = true;
                            errCode = run.error_code;
                            errMsg = run.error;
                        }
                    } else if (!state.running && state.state !== 'QUEUED' && state.active_run_id !== submittedRunId) {
                        const contentFallback = await verifyRunFromContentJson(submittedRunId);
                        if (pollId !== activePollId) return;
                        done = true;
                        if (contentFallback && contentFallback.status === 'ok') {
                            isError = false;
                        } else if (contentFallback && contentFallback.status === 'error') {
                            isError = true;
                            errCode = contentFallback.errorCode;
                            errMsg = contentFallback.errorMessage;
                        } else {
                            isError = true;
                            errCode = 'ERR_RUN_NOT_FOUND';
                            errMsg = t('draw.err.lost');
                        }
                    }

                    if (done) {
                        btn.disabled = false;
                        btn.textContent = t('draw.btn.submit');
                        if (isError) {
                            const code = errCode || 'ERR_PIPELINE_FAILED';
                            showDrawError(code, t('draw.err.reading_failed', { msg: errMsg || 'AI error' }));
                            setStatusKey('draw.status.failed_code', { code });
                            setState(STATES.IDLE);
                        } else {
                            hideDrawError();
                            setStatusKey(webcamRunning ? 'draw.status.ready_next_visitor' : 'draw.status.ready_redirect');
                            if (!webcamRunning) {
                                pendingPostSubmitTimerId = setTimeout(() => {
                                    if (pollId === activePollId) window.location.href = '/';
                                }, 1200);
                            } else {
                                pendingPostSubmitTimerId = setTimeout(() => {
                                    if (pollId === activePollId && gazeState === STATES.SUBMITTING) {
                                        setState(STATES.SEARCHING);
                                    }
                                }, 2500);
                            }
                        }
                        return;
                    }
                } catch (_) {}
            }
            if (pollId !== activePollId) return;
            btn.disabled = false;
            btn.textContent = t('draw.btn.submit');
            showDrawError('ERR_PIPELINE_TIMEOUT', t('draw.err.timeout'));
            setStatusKey('draw.status.timeout');
            setState(STATES.IDLE);
        }

        function solveLinear3x3(A, b) {
            const M = A.map((row, idx) => [...row, b[idx]]);
            for (let col = 0; col < 3; col++) {
                let pivot = col;
                for (let r = col + 1; r < 3; r++) {
                    if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
                }
                [M[col], M[pivot]] = [M[pivot], M[col]];
                if (Math.abs(M[col][col]) < 1e-12) return null;
                const div = M[col][col];
                for (let j = col; j < 4; j++) M[col][j] /= div;
                for (let r = 0; r < 3; r++) {
                    if (r === col) continue;
                    const factor = M[r][col];
                    for (let j = col; j < 4; j++) M[r][j] -= factor * M[col][j];
                }
            }
            return [M[0][3], M[1][3], M[2][3]];
        }

        function fitRidgeAffineAxis(dx, dy, targetOffsets, primaryAxis, minGain, maxGain, defaultGain) {
            const n = dx.length;
            if (n < 6) {
                return primaryAxis === 0 ? [0.0, defaultGain, 0.0] : [0.0, 0.0, defaultGain];
            }
            const lam = 1.5e-5 * n;
            const XtX = [[1e-6, 0, 0], [0, lam, 0], [0, 0, lam]];
            const Xty = [0, 0, 0];
            for (let i = 0; i < n; i++) {
                const f = [1.0, dx[i], dy[i]];
                const y = targetOffsets[i];
                for (let r = 0; r < 3; r++) {
                    Xty[r] += f[r] * y;
                    for (let c = 0; c < 3; c++) {
                        XtX[r][c] += f[r] * f[c];
                    }
                }
            }
            const w = solveLinear3x3(XtX, Xty) || (primaryAxis === 0 ? [0, defaultGain, 0] : [0, 0, defaultGain]);
            const pIdx = primaryAxis + 1;
            const cIdx = (1 - primaryAxis) + 1;
            w[0] = Math.max(-0.15, Math.min(0.15, w[0]));
            w[pIdx] = Math.max(minGain, Math.min(maxGain, w[pIdx]));
            w[cIdx] = Math.max(-4.0, Math.min(4.0, w[cIdx]));
            return w;
        }

        function softSCurve(x, gain = 1.2) {
            const c = (x - 0.5) * 2.0;
            const curved = Math.tanh(c * gain) / Math.tanh(gain);
            return Math.max(0.0, Math.min(1.0, 0.5 + 0.5 * curved));
        }

        function windowSpread(hist) {
            let mx = 0, my = 0;
            for (const p of hist) { mx += p[0]; my += p[1]; }
            mx /= hist.length;
            my /= hist.length;
            let maxD = 0;
            for (const p of hist) {
                const d = Math.hypot(p[0] - mx, p[1] - my);
                if (d > maxD) maxD = d;
            }
            return maxD;
        }

        function fuseBinocularEyes(leftNorm, rightNorm, leftEar, rightEar, thr, isBlinking) {
            if (isBlinking) {
                return [0.5 * (leftNorm[0] + rightNorm[0]), 0.5 * (leftNorm[1] + rightNorm[1])];
            }

            let wLeft = 0.5;
            let wRight = 0.5;

            if (leftEar < thr && rightEar >= thr * 1.15) {
                wLeft = 0.1; wRight = 0.9;
            } else if (rightEar < thr && leftEar >= thr * 1.15) {
                wLeft = 0.9; wRight = 0.1;
            }

            const lOob = Math.max(Math.abs(leftNorm[0]), Math.abs(leftNorm[1])) > 0.45;
            const rOob = Math.max(Math.abs(rightNorm[0]), Math.abs(rightNorm[1])) > 0.45;
            if (lOob && !rOob) {
                wLeft = 0.1; wRight = 0.9;
            } else if (rOob && !lOob) {
                wLeft = 0.9; wRight = 0.1;
            }

            if (leftHist.length >= 4 && rightHist.length >= 4 && !lOob && !rOob) {
                const lSpread = windowSpread(leftHist);
                const rSpread = windowSpread(rightHist);
                if (lSpread < 0.0015 && rSpread > 0.012) {
                    wLeft = 0.15; wRight = 0.85;
                } else if (rSpread < 0.0015 && lSpread > 0.012) {
                    wLeft = 0.85; wRight = 0.15;
                }
            }

            if (leftHist.length >= 1 && rightHist.length >= 1) {
                const lPrev = leftHist[leftHist.length - 1];
                const rPrev = rightHist[rightHist.length - 1];
                const lStep = Math.hypot(leftNorm[0] - lPrev[0], leftNorm[1] - lPrev[1]);
                const rStep = Math.hypot(rightNorm[0] - rPrev[0], rightNorm[1] - rPrev[1]);
                if (lStep > 0.08 && rStep < 0.035) {
                    wLeft = 0.15; wRight = 0.85;
                } else if (rStep > 0.08 && lStep < 0.035) {
                    wLeft = 0.85; wRight = 0.15;
                }
            }

            leftHist.push([leftNorm[0], leftNorm[1]]);
            rightHist.push([rightNorm[0], rightNorm[1]]);
            if (leftHist.length > 5) leftHist.shift();
            if (rightHist.length > 5) rightHist.shift();

            return [
                wLeft * leftNorm[0] + wRight * rightNorm[0],
                wLeft * leftNorm[1] + wRight * rightNorm[1]
            ];
        }

        function computeCanthusGazeAndBlink(lm, frameW = 640, frameH = 480) {
            function pt(idx) {
                return [(1.0 - lm[idx].x) * frameW, lm[idx].y * frameH];
            }
            function avgPts(indices) {
                let sx = 0, sy = 0;
                for (const i of indices) {
                    sx += (1.0 - lm[i].x) * frameW;
                    sy += lm[i].y * frameH;
                }
                return [sx / indices.length, sy / indices.length];
            }
            function canthusEye(irisIndices, cornerAIdx, cornerBIdx, topIdx, botIdx) {
                const iris = avgPts(irisIndices);
                const cA = pt(cornerAIdx);
                const cB = pt(cornerBIdx);
                const leftPt = cA[0] <= cB[0] ? cA : cB;
                const rightPt = cA[0] <= cB[0] ? cB : cA;
                const top = pt(topIdx);
                const bot = pt(botIdx);

                const vx = rightPt[0] - leftPt[0];
                const vy = rightPt[1] - leftPt[1];
                const eyeW = Math.hypot(vx, vy);
                if (eyeW < 1e-4) return { norm: [0, 0], ear: 0.3 };

                const ux = vx / eyeW;
                const uy = vy / eyeW;
                let nx = -uy, ny = ux;
                if (ny < 0) { nx = -nx; ny = -ny; }

                const midX = 0.5 * (leftPt[0] + rightPt[0]);
                const midY = 0.5 * (leftPt[1] + rightPt[1]);
                const rx = iris[0] - midX;
                const ry = iris[1] - midY;

                const normX = (rx * ux + ry * uy) / eyeW;
                const normY = (rx * nx + ry * ny) / eyeW;

                const lidDist = Math.hypot(top[0] - bot[0], top[1] - bot[1]);
                const ear = lidDist / eyeW;
                return { norm: [normX, normY], ear };
            }

            const left = canthusEye([468, 469, 470, 471], 33, 133, 159, 145);
            const right = canthusEye([473, 474, 475, 476], 362, 263, 386, 374);
            const ear = 0.5 * (left.ear + right.ear);
            const minEar = Math.min(left.ear, right.ear);
            const effectiveThr = (gazeState === STATES.CALIBRATING) ? Math.min(blinkEarThr, 0.115) : blinkEarThr;
            const isBlinking = (ear < effectiveThr) && (minEar < effectiveThr * 1.1);

            const fusedEye = fuseBinocularEyes(left.norm, right.norm, left.ear, right.ear, effectiveThr, isBlinking);

            const lOuter = pt(33);
            const rOuter = pt(263);
            const eyeMidX = 0.5 * (lOuter[0] + rOuter[0]);
            const eyeMidY = 0.5 * (lOuter[1] + rOuter[1]);
            const outerDist = Math.max(Math.hypot(rOuter[0] - lOuter[0], rOuter[1] - lOuter[1]), 1e-4);
            const nose = pt(1);
            const headOffset = [
                (nose[0] - eyeMidX) / outerDist,
                (nose[1] - eyeMidY) / outerDist - 0.35
            ];
            const HEAD_WEIGHT = 0.22;

            const norm = [
                fusedEye[0] + HEAD_WEIGHT * headOffset[0],
                fusedEye[1] + HEAD_WEIGHT * headOffset[1]
            ];

            return { norm, isBlinking, ear };
        }

        let lastFrameTs = performance.now();
        let lastDetectTs = 0;
        function processVideoFrame() {
            if (!webcamRunning) return;
            try {
                const video = document.getElementById('webcamVideo');
                const eyeCanvas = document.getElementById('eyeOverlayCanvas');
                const eyeCtx = eyeCanvas.getContext('2d');

                const now = performance.now();
                const dt = Math.max(0.005, Math.min(0.1, (now - lastFrameTs) / 1000.0));
                const fps = Math.round(1.0 / dt);
                lastFrameTs = now;
                document.getElementById('fpsCounter').textContent = `${fps} FPS`;

                if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0 && faceLandmarker) {
                    const detectTs = Math.max(Math.floor(now), lastDetectTs + 1);
                    lastDetectTs = detectTs;
                    const res = faceLandmarker.detectForVideo(video, detectTs);
                    eyeCtx.clearRect(0, 0, eyeCanvas.width, eyeCanvas.height);

                    if (res.faceLandmarks && res.faceLandmarks.length > 0 && res.faceLandmarks[0].length >= 477) {
                        lastGazeTs = now;
                        faceStreak += 1;

                        if (gazeState === STATES.SEARCHING && faceStreak >= CONSECUTIVE_FACE_FRAMES) {
                            setState(STATES.CALIBRATING);
                        }

                        const lm = res.faceLandmarks[0];
                        const frameW = video.videoWidth || 640;
                        const frameH = video.videoHeight || 480;
                        const { norm, isBlinking, ear } = computeCanthusGazeAndBlink(lm, frameW, frameH);

                        eyeCtx.fillStyle = isBlinking ? '#f59e0b' : '#10b981';
                        for (const idx of [468, 469, 470, 471, 473, 474, 475, 476]) {
                            if (lm[idx]) {
                                const x = (1 - lm[idx].x) * eyeCanvas.width;
                                const y = lm[idx].y * eyeCanvas.height;
                                eyeCtx.beginPath();
                                eyeCtx.arc(x, y, 2.5, 0, Math.PI * 2);
                                eyeCtx.fill();
                            }
                        }

                        if (!isBlinking) {
                            normBuffer.push([norm[0], norm[1]]);
                            if (normBuffer.length > ROLLING_BUFFER) normBuffer.shift();
                            const medX = median1D(normBuffer.map(p => p[0]));
                            const medY = median1D(normBuffer.map(p => p[1]));
                            if (!smoothedNorm) {
                                smoothedNorm = [medX, medY];
                            } else {
                                smoothedNorm = [
                                    SMOOTH_ALPHA * smoothedNorm[0] + (1.0 - SMOOTH_ALPHA) * medX,
                                    SMOOTH_ALPHA * smoothedNorm[1] + (1.0 - SMOOTH_ALPHA) * medY
                                ];
                            }
                        }

                        if (gazeState === STATES.CALIBRATING) {
                            if (!calibStartTs) calibStartTs = now;
                            const elapsedMs = Math.max(0, now - calibStartTs);
                            const pct = Math.min(100, Math.round((elapsedMs / CALIB_DURATION_MS) * 100));
                            const step1Ms = CALIB_DURATION_MS * CALIB_STEP1_RATIO;

                            if (!isBlinking) {
                                const [tx, ty] = calibrationTargetAtProgress(pct);
                                if (pct <= 33) {
                                    centerSamples.push([...norm]);
                                    earSamples.push(ear);
                                    calibSamples.push([...norm]);
                                    calibTargets.push([tx, ty]);
                                } else if ((elapsedMs - step1Ms) >= CALIB_STEP2_SKIP_MS) {
                                    calibSamples.push([...norm]);
                                    calibTargets.push([tx, ty]);
                                }
                            }

                            drawCalibrationTarget(pct);
                            setStatusKey(
                                pct <= 33 ? 'draw.status.calibrating_center' : 'draw.status.calibrating_follow',
                                { pct }
                            );

                            if (elapsedMs >= CALIB_DURATION_MS) {
                                if (earSamples.length > 3) {
                                    const baseEar = median1D(earSamples);
                                    blinkEarThr = Math.max(0.10, Math.min(0.155, baseEar * 0.52));
                                }

                                if (centerSamples.length > 3) {
                                    centerNorm = [
                                        median1D(centerSamples.map(s => s[0])),
                                        median1D(centerSamples.map(s => s[1]))
                                    ];
                                } else if (calibSamples.length > 0) {
                                    centerNorm = [
                                        median1D(calibSamples.map(s => s[0])),
                                        median1D(calibSamples.map(s => s[1]))
                                    ];
                                }

                                const dx = calibSamples.map(s => s[0] - centerNorm[0]);
                                const dy = calibSamples.map(s => s[1] - centerNorm[1]);
                                const txOff = calibTargets.map(t => t[0] - 0.5);
                                const tyOff = calibTargets.map(t => t[1] - 0.5);
                                weightsX = fitRidgeAffineAxis(dx, dy, txOff, 0, 4.5, 14.0, 9.0);
                                weightsY = fitRidgeAffineAxis(dx, dy, tyOff, 1, 6.0, 18.0, 13.0);

                                setState(STATES.DRAWING);
                                window.startTimedSession();
                            }
                        } else if (gazeState === STATES.DRAWING && smoothedNorm && !pointerDown) {
                            if (!isBlinking) {
                                const dx = smoothedNorm[0] - centerNorm[0];
                                const dy = smoothedNorm[1] - centerNorm[1];
                                const linX = Math.max(0, Math.min(1, 0.5 + weightsX[0] + weightsX[1] * dx + weightsX[2] * dy));
                                const linY = Math.max(0, Math.min(1, 0.5 + weightsY[0] + weightsY[1] * dx + weightsY[2] * dy));
                                const targetX = softSCurve(linX);
                                const targetY = softSCurve(linY);

                                if (gazeControlMode === 'flow') {
                                    const offX = targetX - 0.5;
                                    const offY = targetY - 0.5;
                                    if (Math.hypot(offX, offY) > 0.08) {
                                        cursorPos[0] = Math.max(0.02, Math.min(0.98, cursorPos[0] + offX * 0.85 * dt));
                                        cursorPos[1] = Math.max(0.02, Math.min(0.98, cursorPos[1] + offY * 0.85 * dt));
                                    }
                                } else {
                                    const prevDist = Math.hypot(cursorPos[0] - 0.5, cursorPos[1] - 0.5);
                                    const newDist = Math.hypot(targetX - 0.5, targetY - 0.5);
                                    const stepDist = Math.hypot(targetX - cursorPos[0], targetY - cursorPos[1]);
                                    const isSnapBack = (prevDist > 0.22 && newDist < prevDist - 0.06 && stepDist > 0.08);
                                    const alpha = isSnapBack ? 0.05 : 0.22;
                                    cursorPos[0] = (1.0 - alpha) * cursorPos[0] + alpha * targetX;
                                    cursorPos[1] = (1.0 - alpha) * cursorPos[1] + alpha * targetY;
                                }
                                updateStroke(cursorPos[0], cursorPos[1]);
                            } else {
                                // Keep prevTime current while blinking so blink duration never inflates dwell blobs
                                prevTime = now;
                            }
                        }
                    } else {
                        faceStreak = 0;
                        if (!pointerDown) {
                            prevPoint = null;
                            dwellTime = 0;
                            prevTime = now;
                        }
                        const pointerRecentlyUsed = lastPointerTs > 0 && (now - lastPointerTs) <= 10000;
                        if (!pointerDown && !pointerRecentlyUsed && lastGazeTs > 0 && (now - lastGazeTs) > GAZE_LOSS_TIMEOUT_MS) {
                            if (gazeState === STATES.CALIBRATING) {
                                setState(STATES.SEARCHING);
                            } else if (gazeState === STATES.DRAWING) {
                                if (hasDrawn) {
                                    window.submitDrawing();
                                } else {
                                    setState(STATES.SEARCHING);
                                }
                            }
                        }
                    }
                }
            } catch (frameErr) {
                console.warn('Transient video frame error:', frameErr);
            } finally {
                if (webcamRunning) {
                    requestAnimationFrame(processVideoFrame);
                }
            }
        }

        drawI18n.mountSwitcher(document.getElementById('drawLangSwitch'), 'dark');
        drawI18n.applyDOM();
        refreshDynamicDrawText();
    </script>
</body>
</html>
