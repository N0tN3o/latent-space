<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Space — Browser Gaze Painter</title>
    <style>
        :root {
            --bg: #0f1116;
            --panel: #181b22;
            --border: #2b303c;
            --accent: #10b981;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn, select.btn-select {
            background: #252934;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn:hover, select.btn-select:hover {
            background: #323846;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .canvas-shell {
            position: relative;
            width: 100%;
            max-width: 1120px;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
            border: 2px solid var(--border);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #cursorCanvas {
            pointer-events: none;
        }

        /* Webcam PIP overlay */
        .pip-box {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 240px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 20;
        }

        .pip-header {
            padding: 6px 10px;
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .pip-video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
        }

        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #eyeOverlayCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .instructions-bar {
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.88rem;
            text-align: center;
        }

        .draw-error-banner {
            display: none;
            width: 100%;
            max-width: 1120px;
            margin-bottom: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid #ef4444;
            color: #fecaca;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="title-group">
            <h2 style="font-size: 1.2rem;">Latent Space — Gaze Painter</h2>
            <span class="status-badge" id="statusBadge">Ready (Move eyes or mouse/touch to draw)</span>
        </div>
        <div class="controls">
            <button class="btn" id="camBtn" onclick="startWebcamGaze()">Start Webcam Eye Tracking</button>
            <button class="btn" id="centerBtn" onclick="recenterCursorNow()" style="display:none;" title="Press Spacebar anytime to re-center the cursor to your current gaze">Center Cursor [Space]</button>
            <button class="btn" id="calibBtn" onclick="startCalibration()" style="display:none;">Recalibrate</button>
            <button class="btn" id="modeBtn" onclick="toggleGazeMode()" title="Switch between Anti-Snap Direct mapping and Gaze Flow Steering">Mode: Stabilized Direct</button>
            <select class="btn-select" id="brushTheme" title="Brush Ink Style">
                <option value="classic">Classic Obsidian Ink</option>
                <option value="ember">Velocity Ember</option>
                <option value="indigo">Midnight Indigo</option>
            </select>
            <button class="btn" onclick="startTimedSession()">15s Session</button>
            <button class="btn" onclick="clearCanvas()">Clear</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitDrawing()">Submit &amp; Analyze</button>
            <a href="/" class="btn">Gallery</a>
            <a href="/kiosk" class="btn">Kiosk</a>
            <a href="/admin" class="btn">Admin</a>
        </div>
    </header>

    <div class="workspace">
        <div class="draw-error-banner" id="drawErrorBanner"></div>
        <div class="canvas-shell">
            <canvas id="artCanvas" width="1280" height="720"></canvas>
            <canvas id="cursorCanvas" width="1280" height="720"></canvas>
        </div>
        <div class="instructions-bar" id="helperText">
            Tip: Press <strong>Spacebar</strong> at any time while looking at the center of the canvas to instantly re-center the cursor (especially helpful when wearing glasses).
        </div>
    </div>

    <div class="pip-box" id="pipBox" style="display:none;">
        <div class="pip-header">
            <span id="pipStatus">Eye Tracker Feed</span>
            <span id="fpsCounter">0 FPS</span>
        </div>
        <div class="pip-video-wrap">
            <video id="webcamVideo" autoplay playsinline muted></video>
            <canvas id="eyeOverlayCanvas" width="320" height="240"></canvas>
        </div>
    </div>

    <script type="module">
        const artCanvas = document.getElementById('artCanvas');
        const artCtx = artCanvas.getContext('2d');
        const cursorCanvas = document.getElementById('cursorCanvas');
        const cursorCtx = cursorCanvas.getContext('2d');
        const statusBadge = document.getElementById('statusBadge');

        const W = 1280;
        const H = 720;

        function resetArtCanvas() {
            artCtx.fillStyle = '#ffffff';
            artCtx.fillRect(0, 0, W, H);
        }
        resetArtCanvas();

        let prevPoint = null;
        let prevTime = performance.now();
        let dwellTime = 0;
        let strokeHistory = [];
        let hasDrawn = false;
        const dwellRadius = 0.03;

        // Explicit State Machine
        const STATES = {
            IDLE: 'IDLE',
            SEARCHING: 'SEARCHING',
            CALIBRATING: 'CALIBRATING',
            DRAWING: 'DRAWING',
            SUBMITTING: 'SUBMITTING',
        };
        let gazeState = STATES.IDLE;
        let sessionTimerId = null;
        let timedEndTimestamp = 0;

        // Gaze control mode: 'hybrid' (Stabilized Direct + Anti-Snap) or 'flow' (Gaze Glider Steering)
        let gazeControlMode = 'hybrid';
        let cursorPos = [0.5, 0.5];

        function clearSessionTimer() {
            if (sessionTimerId !== null) {
                clearInterval(sessionTimerId);
                sessionTimerId = null;
            }
        }

        function showDrawError(errorCode, message) {
            const banner = document.getElementById('drawErrorBanner');
            const codeText = errorCode ? `[${errorCode}] ` : '';
            banner.textContent = `${codeText}${message || 'Pipeline error occurred. Please try again.'}`;
            banner.style.display = 'block';
        }

        function hideDrawError() {
            const banner = document.getElementById('drawErrorBanner');
            banner.style.display = 'none';
            banner.textContent = '';
        }

        function setState(nextState) {
            if (nextState !== STATES.DRAWING) {
                clearSessionTimer();
            }
            gazeState = nextState;

            if (nextState === STATES.IDLE) {
                cursorCtx.clearRect(0, 0, W, H);
                prevPoint = null;
            } else if (nextState === STATES.SEARCHING) {
                calibSamples = [];
                centerSamples = [];
                cursorCtx.clearRect(0, 0, W, H);
                prevPoint = null;
                statusBadge.textContent = 'Searching for gaze — Step in front of camera to begin';
            } else if (nextState === STATES.CALIBRATING) {
                hideDrawError();
                resetArtCanvas();
                hasDrawn = false;
                calibSamples = [];
                centerSamples = [];
                cursorPos = [0.5, 0.5];
                prevPoint = null;
                drawCalibrationTarget(0);
                statusBadge.textContent = 'Calibrating 0% — Look at the center target first';
            } else if (nextState === STATES.DRAWING) {
                hideDrawError();
                cursorPos = [0.5, 0.5];
                prevPoint = null;
                cursorCtx.clearRect(0, 0, W, H);
            } else if (nextState === STATES.SUBMITTING) {
                cursorCtx.clearRect(0, 0, W, H);
                prevPoint = null;
            }
        }

        window.toggleGazeMode = function() {
            gazeControlMode = (gazeControlMode === 'hybrid') ? 'flow' : 'hybrid';
            const btn = document.getElementById('modeBtn');
            btn.textContent = gazeControlMode === 'hybrid'
                ? 'Mode: Stabilized Direct'
                : 'Mode: Gaze Flow (Steering)';
        };

        function getStrokeColor(speedFactor) {
            const theme = document.getElementById('brushTheme').value;
            if (theme === 'ember') {
                const r = Math.min(220, Math.floor(40 + speedFactor * 180));
                const g = Math.floor(speedFactor * 45);
                return `rgb(${r}, ${g}, 10)`;
            } else if (theme === 'indigo') {
                const b = Math.min(200, Math.floor(45 + speedFactor * 155));
                const r = Math.floor(speedFactor * 40);
                return `rgb(${r}, 15, ${b})`;
            }
            const shade = Math.min(75, Math.floor(speedFactor * 55));
            return `rgb(${shade}, 0, 0)`;
        }

        function drawCalibrationTarget(pct) {
            cursorCtx.clearRect(0, 0, W, H);
            let tx = W * 0.5;
            let ty = H * 0.5;
            let instruction = 'Step 1/2: Look steadily at the center target';

            if (pct > 35) {
                const angle = ((pct - 35) / 65.0) * Math.PI * 2.0;
                tx = W * (0.5 + 0.36 * Math.cos(angle));
                ty = H * (0.5 + 0.34 * Math.sin(angle));
                instruction = 'Step 2/2: Follow the moving target with your eyes';

                cursorCtx.strokeStyle = '#e5e7eb';
                cursorCtx.lineWidth = 1.5;
                cursorCtx.beginPath();
                cursorCtx.ellipse(W * 0.5, H * 0.5, W * 0.36, H * 0.34, 0, 0, Math.PI * 2);
                cursorCtx.stroke();
            }

            // Outer ring & crosshairs
            cursorCtx.strokeStyle = '#10b981';
            cursorCtx.lineWidth = 3;
            cursorCtx.beginPath();
            cursorCtx.arc(tx, ty, 28, 0, Math.PI * 2);
            cursorCtx.stroke();

            cursorCtx.lineWidth = 1.2;
            cursorCtx.beginPath();
            cursorCtx.moveTo(tx - 38, ty);
            cursorCtx.lineTo(tx + 38, ty);
            cursorCtx.moveTo(tx, ty - 38);
            cursorCtx.lineTo(tx, ty + 38);
            cursorCtx.stroke();

            // Center bullseye
            cursorCtx.fillStyle = '#10b981';
            cursorCtx.beginPath();
            cursorCtx.arc(tx, ty, 8, 0, Math.PI * 2);
            cursorCtx.fill();

            // Progress bar
            const barW = W * 0.5;
            const barH = 10;
            const barX = (W - barW) * 0.5;
            const barY = H - 46;
            cursorCtx.fillStyle = '#e5e7eb';
            cursorCtx.fillRect(barX, barY, barW, barH);
            cursorCtx.fillStyle = '#10b981';
            cursorCtx.fillRect(barX, barY, barW * (Math.max(0, Math.min(100, pct)) / 100.0), barH);

            // Label
            cursorCtx.fillStyle = '#111827';
            cursorCtx.font = '600 18px Segoe UI, sans-serif';
            cursorCtx.textAlign = 'center';
            cursorCtx.fillText(`Calibrating Gaze (${pct}%) — ${instruction}`, W * 0.5, barY - 14);
        }

        function updateStroke(normX, normY) {
            const now = performance.now();
            const dt = Math.max(0.001, (now - prevTime) / 1000.0);
            prevTime = now;

            const gx = Math.max(0, Math.min(W, normX * W));
            const gy = Math.max(0, Math.min(H, normY * H));
            const curPoint = { x: gx, y: gy };

            cursorCtx.clearRect(0, 0, W, H);
            cursorCtx.strokeStyle = gazeControlMode === 'flow' ? '#3b82f6' : '#10b981';
            cursorCtx.lineWidth = 1.5;
            cursorCtx.beginPath();
            cursorCtx.moveTo(gx - 18, gy);
            cursorCtx.lineTo(gx + 18, gy);
            cursorCtx.moveTo(gx, gy - 18);
            cursorCtx.lineTo(gx, gy + 18);
            cursorCtx.stroke();
            cursorCtx.beginPath();
            cursorCtx.arc(gx, gy, 7, 0, Math.PI * 2);
            cursorCtx.stroke();

            if (!prevPoint) {
                prevPoint = curPoint;
                dwellTime = 0;
                strokeHistory = [curPoint];
                return;
            }

            const dx = (curPoint.x - prevPoint.x) / W;
            const dy = (curPoint.y - prevPoint.y) / H;
            const dist = Math.hypot(dx, dy);

            if (dist < dwellRadius) {
                dwellTime += dt;
            } else {
                dwellTime = 0;
            }

            const baseWidth = 2;
            const dwellBonus = Math.min(20, Math.floor(dwellTime * 10));
            const speedFactor = Math.max(0.2, Math.min(1.0, dist * 50));
            let lineWidth = Math.floor((baseWidth + dwellBonus) * (2.0 - speedFactor));
            lineWidth = Math.max(1, Math.min(36, lineWidth));

            strokeHistory.push(curPoint);
            if (strokeHistory.length > 5) strokeHistory.shift();

            artCtx.lineCap = 'round';
            artCtx.lineJoin = 'round';
            const strokeColor = getStrokeColor(speedFactor);
            artCtx.strokeStyle = strokeColor;
            artCtx.lineWidth = lineWidth;

            artCtx.beginPath();
            artCtx.moveTo(prevPoint.x, prevPoint.y);
            artCtx.lineTo(curPoint.x, curPoint.y);
            artCtx.stroke();

            artCtx.fillStyle = strokeColor;
            artCtx.beginPath();
            artCtx.arc(curPoint.x, curPoint.y, Math.max(1, lineWidth / 2), 0, Math.PI * 2);
            artCtx.fill();

            hasDrawn = true;
            prevPoint = curPoint;
        }

        // Pointer / Touch drawing support
        let pointerDown = false;
        function getNormFromEvent(e) {
            const rect = artCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) / rect.width,
                y: (clientY - rect.top) / rect.height
            };
        }

        artCanvas.addEventListener('mousedown', (e) => {
            pointerDown = true;
            prevPoint = null;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        });
        artCanvas.addEventListener('mousemove', (e) => {
            if (!pointerDown) return;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        });
        window.addEventListener('mouseup', () => {
            pointerDown = false;
            prevPoint = null;
        });

        artCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pointerDown = true;
            prevPoint = null;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        }, { passive: false });
        artCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!pointerDown) return;
            const p = getNormFromEvent(e);
            updateStroke(p.x, p.y);
        }, { passive: false });
        window.addEventListener('touchend', () => {
            pointerDown = false;
            prevPoint = null;
        });

        window.clearCanvas = function() {
            clearSessionTimer();
            hideDrawError();
            resetArtCanvas();
            cursorCtx.clearRect(0, 0, W, H);
            prevPoint = null;
            hasDrawn = false;
            cursorPos = [0.5, 0.5];
            if (webcamRunning && gazeState !== STATES.CALIBRATING) {
                setState(STATES.DRAWING);
            }
            statusBadge.textContent = 'Canvas cleared';
        };

        window.startTimedSession = function() {
            clearSessionTimer();
            hideDrawError();
            resetArtCanvas();
            cursorCtx.clearRect(0, 0, W, H);
            prevPoint = null;
            hasDrawn = false;
            cursorPos = [0.5, 0.5];
            setState(STATES.DRAWING);

            timedEndTimestamp = performance.now() + 15000;
            statusBadge.textContent = `Drawing (${gazeControlMode.toUpperCase()})... 15.0s remaining`;
            sessionTimerId = setInterval(() => {
                if (gazeState !== STATES.DRAWING) {
                    clearSessionTimer();
                    return;
                }
                const rem = (timedEndTimestamp - performance.now()) / 1000;
                if (rem <= 0) {
                    clearSessionTimer();
                    if (hasDrawn) {
                        window.submitDrawing();
                    } else if (webcamRunning) {
                        setState(STATES.SEARCHING);
                    } else {
                        setState(STATES.IDLE);
                        statusBadge.textContent = 'Session ended (blank canvas)';
                    }
                } else {
                    statusBadge.textContent = `Drawing (${gazeControlMode.toUpperCase()})... ${rem.toFixed(1)}s remaining`;
                }
            }, 100);
        };

        window.submitDrawing = async function() {
            if (gazeState === STATES.SUBMITTING) {
                return;
            }
            if (!hasDrawn) {
                alert('Please draw something on the canvas first (using your eyes or mouse/touch).');
                return;
            }
            setState(STATES.SUBMITTING);
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Uploading & Analyzing...';
            statusBadge.textContent = 'Sending drawing to AI pipeline...';

            try {
                const dataUrl = artCanvas.toDataURL('image/png');
                const res = await fetch('/api/drawings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });
                const result = await res.json();
                if (res.ok && result.status === 'success') {
                    statusBadge.textContent = result.queue_length > 1
                        ? `Queued (#${result.queue_length}) — Generating reading...`
                        : 'Analysis Pipeline Running — Generating reading...';
                    pollPipelineUntilDone(result.run_id);
                } else {
                    showDrawError(result.error_code, result.error || 'Upload failed');
                    btn.disabled = false;
                    btn.textContent = 'Submit & Analyze';
                    setState(webcamRunning ? STATES.SEARCHING : STATES.IDLE);
                }
            } catch (e) {
                showDrawError('ERR_UPLOAD', 'Error submitting drawing: ' + e);
                btn.disabled = false;
                btn.textContent = 'Submit & Analyze';
                setState(webcamRunning ? STATES.SEARCHING : STATES.IDLE);
            }
        };

        async function pollPipelineUntilDone(submittedRunId) {
            const btn = document.getElementById('submitBtn');
            for (let i = 0; i < 60; i++) {
                await new Promise(r => setTimeout(r, 1200));
                try {
                    const res = await fetch('/api/pipeline/status?t=' + Date.now());
                    const state = await res.json();
                    const stillWaiting = state.running
                        && (state.active_run_id === submittedRunId || state.queue_length > 0);
                    if (!stillWaiting && state.state !== 'QUEUED') {
                        btn.disabled = false;
                        btn.textContent = 'Submit & Analyze';
                        if (state.last_status === 'error') {
                            const code = state.last_error_code || 'ERR_PIPELINE_FAILED';
                            showDrawError(code, `We could not complete your reading (${state.last_error || 'AI error'}). Please try again.`);
                            statusBadge.textContent = `Failed (${code}) — Ready to retry`;
                        } else {
                            hideDrawError();
                            statusBadge.textContent = webcamRunning
                                ? 'Artwork & Poem Ready on Gallery — Next visitor may begin'
                                : 'Artwork & Poem Ready — Redirecting to Gallery...';
                        }
                        if (!webcamRunning) {
                            if (state.last_status !== 'error') {
                                setTimeout(() => { window.location.href = '/'; }, 1200);
                            } else {
                                setState(STATES.IDLE);
                            }
                        } else {
                            setTimeout(() => {
                                if (gazeState === STATES.SUBMITTING) {
                                    setState(STATES.SEARCHING);
                                }
                            }, 2500);
                        }
                        return;
                    }
                } catch (_) {}
            }
            btn.disabled = false;
            btn.textContent = 'Submit & Analyze';
            if (webcamRunning) {
                setState(STATES.SEARCHING);
            } else {
                window.location.href = '/';
            }
        }

        // --- MediaPipe FaceLandmarker Webcam Gaze Tracking ---
        let faceLandmarker = null;
        let webcamRunning = false;
        let lastGazeTs = 0;
        const GAZE_LOSS_TIMEOUT_MS = 2000;
        let calibSamples = [];
        let centerSamples = [];
        const CALIB_NEEDED = 85;
        let centerNorm = [0.0, 0.0];
        let spanNorm = [0.11, 0.075];
        let smoothedNorm = null;
        let leftHist = [];
        let rightHist = [];

        function softSCurve(x, gain = 1.2) {
            const c = (x - 0.5) * 2.0;
            const curved = Math.tanh(c * gain) / Math.tanh(gain);
            return Math.max(0.0, Math.min(1.0, 0.5 + 0.5 * curved));
        }

        window.recenterCursorNow = function() {
            if (smoothedNorm) {
                centerNorm = [smoothedNorm[0], smoothedNorm[1]];
            }
            cursorPos = [0.5, 0.5];
            prevPoint = null;
            statusBadge.textContent = 'Cursor re-centered to current gaze';
        };

        window.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
                return;
            }
            if (e.code === 'Space' && webcamRunning) {
                e.preventDefault();
                window.recenterCursorNow();
            } else if ((e.key === 'c' || e.key === 'C') && webcamRunning && gazeState !== STATES.SUBMITTING) {
                e.preventDefault();
                window.startCalibration();
            } else if (e.key === 'm' || e.key === 'M') {
                e.preventDefault();
                window.toggleGazeMode();
            }
        });

        window.startCalibration = function() {
            setState(STATES.CALIBRATING);
        };

        window.startWebcamGaze = async function() {
            const camBtn = document.getElementById('camBtn');
            camBtn.disabled = true;
            camBtn.textContent = 'Loading Eye Tracker...';
            statusBadge.textContent = 'Loading MediaPipe FaceLandmarker...';

            try {
                const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
                const filesetResolver = await vision.FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                faceLandmarker = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numFaces: 1
                });

                const video = document.getElementById('webcamVideo');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' }
                });
                video.srcObject = stream;
                await video.play();

                document.getElementById('pipBox').style.display = 'block';
                document.getElementById('calibBtn').style.display = 'inline-block';
                document.getElementById('centerBtn').style.display = 'inline-block';
                camBtn.textContent = 'Webcam Active';
                webcamRunning = true;
                window.startCalibration();
                requestAnimationFrame(processVideoFrame);
            } catch (err) {
                console.error(err);
                alert('Could not start webcam eye tracker: ' + err.message + '\nYou can still draw using mouse or touch.');
                camBtn.disabled = false;
                camBtn.textContent = 'Start Webcam Eye Tracking';
                statusBadge.textContent = 'Mouse / Touch Drawing Active';
            }
        };

        function computeCanthusGazeAndBlink(lm) {
            // Mirrored X coordinate (1 - x) to match flipped webcam view
            function pt(idx) {
                return [1.0 - lm[idx].x, lm[idx].y];
            }
            function avgPts(indices) {
                let sx = 0, sy = 0;
                for (const i of indices) {
                    sx += (1.0 - lm[i].x);
                    sy += lm[i].y;
                }
                return [sx / indices.length, sy / indices.length];
            }
            function canthusEye(irisIndices, cornerAIdx, cornerBIdx, topIdx, botIdx) {
                const iris = avgPts(irisIndices);
                const cA = pt(cornerAIdx);
                const cB = pt(cornerBIdx);
                // Always orient from left (smaller X) to right (larger X) so both eyes have +X rightward!
                const leftPt = cA[0] <= cB[0] ? cA : cB;
                const rightPt = cA[0] <= cB[0] ? cB : cA;
                const top = pt(topIdx);
                const bot = pt(botIdx);

                const vx = rightPt[0] - leftPt[0];
                const vy = rightPt[1] - leftPt[1];
                const eyeW = Math.hypot(vx, vy);
                if (eyeW < 1e-4) return { norm: [0, 0], ear: 0.3 };

                const ux = vx / eyeW;
                const uy = vy / eyeW;
                let nx = -uy, ny = ux;
                if (ny < 0) { nx = -nx; ny = -ny; }

                const midX = 0.5 * (leftPt[0] + rightPt[0]);
                const midY = 0.5 * (leftPt[1] + rightPt[1]);
                const rx = iris[0] - midX;
                const ry = iris[1] - midY;

                const normX = (rx * ux + ry * uy) / eyeW;
                const normY = (rx * nx + ry * ny) / eyeW;

                const lidDist = Math.hypot(top[0] - bot[0], top[1] - bot[1]);
                const ear = lidDist / eyeW;
                return { norm: [normX, normY], ear };
            }

            const left = canthusEye([468, 469, 470, 471], 33, 133, 159, 145);
            const right = canthusEye([473, 474, 475, 476], 362, 263, 386, 374);
            const ear = 0.5 * (left.ear + right.ear);
            const isBlinking = ear < 0.165;

            // Glasses glare outlier rejection: weight the steadier eye higher
            leftHist.push(left.norm);
            rightHist.push(right.norm);
            if (leftHist.length > 5) leftHist.shift();
            if (rightHist.length > 5) rightHist.shift();

            function median2D(arr) {
                const xs = arr.map(p => p[0]).sort((a, b) => a - b);
                const ys = arr.map(p => p[1]).sort((a, b) => a - b);
                const m = Math.floor(arr.length / 2);
                return [xs[m], ys[m]];
            }
            const lMed = median2D(leftHist);
            const rMed = median2D(rightHist);
            const lJit = Math.hypot(left.norm[0] - lMed[0], left.norm[1] - lMed[1]) + 1e-4;
            const rJit = Math.hypot(right.norm[0] - rMed[0], right.norm[1] - rMed[1]) + 1e-4;
            const wLeft = rJit / (lJit + rJit);
            const wRight = lJit / (lJit + rJit);

            const fusedEye = [
                wLeft * left.norm[0] + wRight * right.norm[0],
                wLeft * left.norm[1] + wRight * right.norm[1]
            ];

            // Gentle head-pose assist from nose tip (1)
            const nose = pt(1);
            const headOffset = [nose[0] - 0.5, nose[1] - 0.5];
            const HEAD_WEIGHT = 0.22;

            const norm = [
                fusedEye[0] + HEAD_WEIGHT * headOffset[0],
                fusedEye[1] + HEAD_WEIGHT * headOffset[1]
            ];

            return { norm, isBlinking, ear };
        }

        let lastFrameTs = performance.now();
        function processVideoFrame() {
            if (!webcamRunning) return;
            const video = document.getElementById('webcamVideo');
            const eyeCanvas = document.getElementById('eyeOverlayCanvas');
            const eyeCtx = eyeCanvas.getContext('2d');

            const now = performance.now();
            const dt = Math.max(0.005, Math.min(0.1, (now - lastFrameTs) / 1000.0));
            const fps = Math.round(1.0 / dt);
            lastFrameTs = now;
            document.getElementById('fpsCounter').textContent = `${fps} FPS`;

            if (video.readyState >= 2 && faceLandmarker) {
                const res = faceLandmarker.detectForVideo(video, now);
                eyeCtx.clearRect(0, 0, eyeCanvas.width, eyeCanvas.height);

                if (res.faceLandmarks && res.faceLandmarks.length > 0) {
                    lastGazeTs = now;

                    // Transition SEARCHING -> CALIBRATING when a visitor's face appears
                    if (gazeState === STATES.SEARCHING) {
                        setState(STATES.CALIBRATING);
                    }

                    const lm = res.faceLandmarks[0];
                    const { norm, isBlinking } = computeCanthusGazeAndBlink(lm);

                    eyeCtx.fillStyle = isBlinking ? '#f59e0b' : '#10b981';
                    for (const idx of [468, 469, 470, 471, 473, 474, 475, 476]) {
                        if (lm[idx]) {
                            const x = (1 - lm[idx].x) * eyeCanvas.width;
                            const y = lm[idx].y * eyeCanvas.height;
                            eyeCtx.beginPath();
                            eyeCtx.arc(x, y, 2.5, 0, Math.PI * 2);
                            eyeCtx.fill();
                        }
                    }

                    if (!isBlinking) {
                        if (!smoothedNorm) {
                            smoothedNorm = norm;
                        } else {
                            smoothedNorm = [
                                0.60 * smoothedNorm[0] + 0.40 * norm[0],
                                0.60 * smoothedNorm[1] + 0.40 * norm[1]
                            ];
                        }
                    }

                    if (gazeState === STATES.CALIBRATING && smoothedNorm && !isBlinking) {
                        calibSamples.push([...smoothedNorm]);
                        const pct = Math.min(100, Math.round((calibSamples.length / CALIB_NEEDED) * 100));
                        if (pct <= 35) {
                            centerSamples.push([...smoothedNorm]);
                        }
                        drawCalibrationTarget(pct);
                        statusBadge.textContent = pct <= 35
                            ? `Calibrating ${pct}% — Look at the center target`
                            : `Calibrating ${pct}% — Follow the moving target`;

                        if (calibSamples.length >= CALIB_NEEDED) {
                            const xs = calibSamples.map(s => s[0]).sort((a, b) => a - b);
                            const ys = calibSamples.map(s => s[1]).sort((a, b) => a - b);

                            if (centerSamples.length > 3) {
                                const cxs = centerSamples.map(s => s[0]).sort((a, b) => a - b);
                                const cys = centerSamples.map(s => s[1]).sort((a, b) => a - b);
                                const cm = Math.floor(centerSamples.length / 2);
                                centerNorm = [cxs[cm], cys[cm]];
                            } else {
                                const m = Math.floor(xs.length / 2);
                                centerNorm = [xs[m], ys[m]];
                            }

                            const p10 = Math.floor(xs.length * 0.10);
                            const p90 = Math.floor(xs.length * 0.90);
                            spanNorm = [
                                Math.max(0.11, xs[p90] - xs[p10]),
                                Math.max(0.075, ys[p90] - ys[p10])
                            ];
                            window.startTimedSession();
                        }
                    } else if (gazeState === STATES.DRAWING && smoothedNorm) {
                        if (!isBlinking) {
                            const linX = Math.max(0, Math.min(1, 0.5 + (smoothedNorm[0] - centerNorm[0]) / spanNorm[0]));
                            const linY = Math.max(0, Math.min(1, 0.5 + (smoothedNorm[1] - centerNorm[1]) / spanNorm[1]));
                            const targetX = softSCurve(linX);
                            const targetY = softSCurve(linY);

                            if (gazeControlMode === 'flow') {
                                const offX = targetX - 0.5;
                                const offY = targetY - 0.5;
                                if (Math.hypot(offX, offY) > 0.08) {
                                    cursorPos[0] = Math.max(0.02, Math.min(0.98, cursorPos[0] + offX * 0.85 * dt));
                                    cursorPos[1] = Math.max(0.02, Math.min(0.98, cursorPos[1] + offY * 0.85 * dt));
                                }
                            } else {
                                // Anti-Center-Snap Dampening
                                const prevDist = Math.hypot(cursorPos[0] - 0.5, cursorPos[1] - 0.5);
                                const newDist = Math.hypot(targetX - 0.5, targetY - 0.5);
                                const stepDist = Math.hypot(targetX - cursorPos[0], targetY - cursorPos[1]);
                                const isSnapBack = (prevDist > 0.22 && newDist < prevDist - 0.06 && stepDist > 0.08);
                                const alpha = isSnapBack ? 0.05 : 0.22;
                                cursorPos[0] = (1.0 - alpha) * cursorPos[0] + alpha * targetX;
                                cursorPos[1] = (1.0 - alpha) * cursorPos[1] + alpha * targetY;
                            }
                        }
                        updateStroke(cursorPos[0], cursorPos[1]);
                    }
                } else if (lastGazeTs > 0 && (now - lastGazeTs) > GAZE_LOSS_TIMEOUT_MS) {
                    if (gazeState === STATES.CALIBRATING) {
                        setState(STATES.SEARCHING);
                    } else if (gazeState === STATES.DRAWING) {
                        if (hasDrawn) {
                            window.submitDrawing();
                        } else {
                            setState(STATES.SEARCHING);
                        }
                    }
                }
            }

            requestAnimationFrame(processVideoFrame);
        }
    </script>
